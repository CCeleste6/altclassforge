<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Prototype - Teacher View</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        :root {
            --bg-color: #0b0c15; /* Cor escura estilo LoL */
            --card-bg: #1e2328;
            --gold: #c8aa6e;     /* Dourado Hextech */
            --blue: #0ac8b9;     /* Azul Ilhas das Sombras/Tech */
            --text: #f0f0f0;
        }
        
        body { 
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; 
            background: var(--bg-color); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; font-size: 1.5rem; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }

        /* PAINEL DE CONFIGURAÇÃO (Estilo Formulário) */
        .config-panel {
            background: rgba(30, 35, 40, 0.9);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
            transition: all 0.5s ease;
        }

        input, textarea { 
            width: 100%; box-sizing: border-box; 
            background: #121212; border: 1px solid #444; color: #fff; 
            padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px;
        }
        
        button {
            background: linear-gradient(45deg, #b38936, #f5d67b);
            color: #000; font-weight: bold; border: none;
            padding: 12px 25px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-bottom: 10px;
        }
        button:hover { filter: brightness(1.1); }
        .btn-demo { background: #333; color: #aaa; border: 1px solid #555; }

        /* MAPA HORIZONTAL (Estilo Runeterra) */
        #game-map-container {
            width: 100%;
            overflow-x: auto; /* Scroll Horizontal */
            padding: 50px 20px;
            display: none; /* Escondido inicialmente */
            white-space: nowrap; /* Impede quebra de linha */
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--bg-color);
        }

        /* O Caminho (Nodes) */
        .map-wrapper {
            display: inline-flex;
            align-items: center;
            gap: 20px;
        }

        .node-card {
            display: inline-block;
            vertical-align: top;
            width: 280px;
            white-space: normal; /* Texto dentro do card quebra normal */
            background: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        .node-card:hover { transform: translateY(-10px); border-color: var(--blue); }

        .node-icon {
            width: 50px; height: 50px; background: #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 15px auto;
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .boss-card { border-color: #ff4444; background: linear-gradient(180deg, #1e2328, #2a1a1a); }
        .boss-card .node-icon { border-color: #ff4444; box-shadow: 0 0 15px #ff4444; }

        .connector {
            display: inline-block;
            width: 50px;
            height: 4px;
            background: #444;
            border-radius: 2px;
        }

        .details-box {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ccc;
        }

        .hidden { display: none !important; }
        
        /* Loading Animation */
        .loader { border: 8px solid #333; border-top: 8px solid var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header style="text-align: center;">
        <h1>🛡️ Class Forge 🛡️</h1>
        <p style="color: #888; margin-top: -10px;">Teacher's Dashboard</p>
    </header>

    <div class="config-panel" id="setup-panel">
        <label>1. Carregar Conteúdo (PDF ou Texto)</label>
        <input type="file" id="fileInput" accept=".pdf, .txt">
        <textarea id="classContent" placeholder="O texto extraído aparecerá aqui para você conferir..."></textarea>
        
        <label>2. Chave de Inteligência (Google Gemini)</label>
        <input type="password" id="apiKey" placeholder="Cole a API Key (Começa com AIza...)">
        
        <button onclick="generateAdventure(true)">🔮 Criar Jornada com IA</button>
        <button class="btn-demo" onclick="generateAdventure(false)">🎲 Testar com Dados Fictícios</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center;">
        <div class="loader"></div>
        <h3 style="color: var(--gold)">Forjando o Caminho...</h3>
        <p>A IA está lendo seu documento e criando inimigos.</p>
    </div>

    <div id="game-map-container">
        <div id="map-wrapper" class="map-wrapper">
            </div>
        <div style="text-align: center; margin-top: 20px; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
            <button onclick="location.reload()" style="width: auto; padding: 10px 40px; box-shadow: 0 0 20px #000;">Nova Aventura</button>
        </div>
    </div>

<script>
    // --- 1. LEITURA DE PDF ---
    let pdfRawText = "";

    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5); 
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + " ";
            }
            return fullText;
        } catch (e) {
            console.error(e);
            alert("Erro ao ler o PDF. Verifique se não é um arquivo corrompido ou protegido.");
            return "";
        }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        const textArea = document.getElementById('classContent');
        textArea.value = "⏳ Extraindo texto do arquivo...";
        
        if (file.type === "application/pdf") {
            pdfRawText = await readPDF(file);
            if(pdfRawText.trim() === "") {
                textArea.value = "⚠️ ALERTA: O texto extraído está vazio. Se este PDF for uma imagem escaneada, a IA não conseguirá ler. Tente copiar e colar o texto manualmente.";
            } else {
                textArea.value = pdfRawText; // Mostra o texto para o usuário confirmar
            }
        } else {
            const reader = new FileReader();
            reader.onload = function(e) {
                pdfRawText = e.target.result;
                textArea.value = e.target.result;
            };
            reader.readAsText(file);
        }
    });

    // --- 2. INTEGRAÇÃO COM IA ---
    async function generateAdventure(useRealAI) {
        const content = document.getElementById('classContent').value; // Pega o que está na caixa de texto (editável)
        const apiKey = document.getElementById('apiKey').value;
        
        if (!content && useRealAI) { alert("O campo de texto está vazio! Carregue um arquivo ou digite algo."); return; }
        if (useRealAI && !apiKey) { alert("Cole sua API Key para usar a IA Real!"); return; }

        // UI Updates
        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        let adventureData = [];

        if (useRealAI) {
            try {
                const prompt = `
                Você é um Mestre de RPG Educacional.
                Texto base: "${content.substring(0, 3000)}"
                
                Crie 4 estágios de uma jornada (3 desafios + 1 Boss).
                Responda APENAS JSON puro:
                [
                    {"title": "Nome Criativo", "desc": "Contexto", "type": "enemy", "question": "Pergunta Múltipla Escolha", "options": ["A","B","C"], "correct": 1},
                    {"title": "Nome do Boss", "desc": "Contexto", "type": "boss", "question": "Pergunta Aberta Difícil", "options": [], "correct": "Gabarito"}
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error("Falha na requisição da API");
                
                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;
                const jsonClean = textResponse.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonClean);

            } catch (error) {
                console.error(error);
                alert("Erro na IA: " + error.message + "\n\nVerifique sua API Key. Voltando para o menu.");
                location.reload(); 
                return;
            }
        } else {
            // DADOS DEMO
            await new Promise(r => setTimeout(r, 1500));
            adventureData = [
                { title: "Floresta dos Conceitos", desc: "O início da jornada.", type: "enemy", question: "Questão Exemplo 1?", options: ["Errada", "Certa", "Errada"], correct: 1 },
                { title: "Caverna da Dúvida", desc: "Fica mais escuro aqui.", type: "enemy", question: "Questão Exemplo 2?", options: ["Certa", "Errada"], correct: 0 },
                { title: "Torre do Guardião", desc: "Quase no topo.", type: "enemy", question: "Questão Exemplo 3?", options: ["Errada", "Errada", "Certa"], correct: 2 },
                { title: "Dragão Final", desc: "O teste definitivo.", type: "boss", question: "Questão Dissertativa Final?", options: [], correct: "Resposta esperada..." }
            ];
        }

        renderMap(adventureData);
    }

    // --- 3. RENDERIZAÇÃO HORIZONTAL ---
    function renderMap(data) {
        const wrapper = document.getElementById('map-wrapper');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('game-map-container').style.display = 'block';
        wrapper.innerHTML = '';

        data.forEach((node, index) => {
            // Adiciona conector (se não for o primeiro)
            if (index > 0) {
                const conn = document.createElement('div');
                conn.className = 'connector';
                wrapper.appendChild(conn);
            }

            // Cria o Card
            const card = document.createElement('div');
            card.className = `node-card ${node.type === 'boss' ? 'boss-card' : ''}`;
            
            let icon = node.type === 'boss' ? '👑' : '⚔️';
            let quizContent = '';
            
            if(node.options && node.options.length > 0) {
                quizContent = `
                    <div class="details-box">
                        <strong>Q:</strong> ${node.question}
                        <hr style="border-color:#555; opacity:0.3">
                        <div style="color: #4cd137">✔ ${node.options[node.correct]}</div>
                    </div>`;
            } else {
                quizContent = `
                    <div class="details-box" style="border: 1px solid #c8aa6e;">
                        <strong>BOSS:</strong> ${node.question}
                    </div>`;
            }

            card.innerHTML = `
                <div class="node-icon">${icon}</div>
                <h3 style="margin:0; color: var(--gold)">${node.title}</h3>
                <p style="font-size:0.9rem; color:#aaa">${node.desc}</p>
                ${quizContent}
            `;
            
            wrapper.appendChild(card);
        });
    }
</script>

</body>
</html>
