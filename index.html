<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Prototype - Playable Version</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        /* --- TEMA LEGENDS OF RUNETERRA --- */
        :root {
            --bg-color: #0b0c15; 
            --card-bg: #1e2328;
            --gold: #c8aa6e;     
            --gold-light: #f0e6d2;
            --blue: #0ac8b9;     
            --red: #ff4444;
            --green: #4cd137;
            --text: #f0f0f0;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; cursor: default; }

        /* PAINEL DE CONFIGURAÇÃO */
        .config-panel {
            background: rgba(30, 35, 40, 0.95);
            border: 1px solid #444;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            z-index: 10;
            transition: all 0.5s;
        }

        input, textarea { 
            width: 100%; box-sizing: border-box; 
            background: #121212; border: 1px solid #444; color: #fff; 
            padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px;
        }
        
        button {
            background: linear-gradient(45deg, #b38936, #f5d67b);
            color: #1a1a1a; font-weight: bold; border: 1px solid var(--gold);
            padding: 12px 25px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-bottom: 10px;
            transition: all 0.2s;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); box-shadow: 0 5px 15px rgba(200, 170, 110, 0.3); }
        .btn-demo { background: #333; color: #aaa; border: 1px solid #555; }

        /* MAPA HORIZONTAL */
        #game-map-container {
            width: 100%;
            overflow-x: auto; 
            padding: 50px 20px;
            display: none; 
            white-space: nowrap; 
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--bg-color);
        }

        .map-wrapper { display: inline-flex; align-items: center; gap: 40px; padding-bottom: 20px; }

        .node-card {
            display: inline-block;
            vertical-align: top;
            width: 220px;
            white-space: normal;
            background: var(--card-bg);
            border: 2px solid #444;
            border-radius: 8px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s, border-color 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
            cursor: pointer;
            text-align: center;
        }
        
        .node-card:hover { transform: translateY(-15px) scale(1.05); border-color: var(--gold); cursor: pointer; }
        .node-card:active { transform: scale(0.95); }

        .node-icon {
            width: 60px; height: 60px; background: #111; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 15px auto;
            border: 2px solid var(--gold);
            box-shadow: 0 0 15px rgba(200, 170, 110, 0.2);
        }

        .boss-card { border-color: var(--red); background: linear-gradient(180deg, #2a1a1a, #1a0a0a); }
        .boss-card .node-icon { border-color: var(--red); box-shadow: 0 0 20px var(--red); }

        .connector { display: inline-block; width: 40px; height: 2px; background: #555; margin: 0 -10px; }

        /* --- MODAL DE BATALHA (O NOVO JOGO) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85);
            backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center;
            z-index: 100; opacity: 0; transition: opacity 0.3s;
        }
        
        .battle-card {
            background: #1e2328;
            border: 2px solid var(--gold);
            width: 90%; max-width: 500px;
            padding: 30px;
            border-radius: 12px;
            text-align: center;
            box-shadow: 0 0 50px rgba(200, 170, 110, 0.2);
            transform: scale(0.8); transition: transform 0.3s;
            position: relative;
        }

        .battle-title { color: var(--gold); font-size: 1.5rem; margin-bottom: 20px; text-transform: uppercase; }
        .battle-question { font-size: 1.2rem; margin-bottom: 30px; line-height: 1.5; }

        .option-btn {
            display: block; width: 100%;
            background: #2a2e35; border: 1px solid #444;
            padding: 15px; margin: 10px 0;
            color: #fff; text-align: left; font-size: 1rem;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .option-btn:hover { background: #3a3e45; border-color: var(--gold); }

        /* Estados de Resposta */
        .correct { background: #1a4a1a !important; border-color: var(--green) !important; color: var(--green) !important; }
        .wrong { background: #4a1a1a !important; border-color: var(--red) !important; opacity: 0.6; }

        .close-btn {
            margin-top: 20px; background: transparent; border: 1px solid #555; color: #888; width: auto; padding: 5px 20px; font-size: 0.8rem;
        }
        .close-btn:hover { border-color: #fff; color: #fff; background: transparent; }

        .hidden { display: none !important; }
        .show-modal { display: flex; opacity: 1; }
        .show-card { transform: scale(1); }
        
        /* Loading */
        .loader { border: 5px solid #333; border-top: 5px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header style="text-align: center;">
        <h1>🛡️ Class Forge 🛡️</h1>
        <p style="color: #666; font-size: 0.9rem; margin-top: -10px;">PROTOTIPO FUNCIONAL V5</p>
    </header>

    <div class="config-panel" id="setup-panel">
        <label>1. Carregar Conteúdo (PDF ou Texto)</label>
        <input type="file" id="fileInput" accept=".pdf, .txt">
        <textarea id="classContent" placeholder="O conteúdo da aula será extraído aqui..."></textarea>
        
        <label>2. Chave de Inteligência (Gemini)</label>
        <input type="password" id="apiKey" placeholder="Cole sua API Key NOVA aqui">
        
        <button onclick="generateAdventure(true)">🔮 Criar Jornada (IA Real)</button>
        <button class="btn-demo" onclick="generateAdventure(false)">🎲 Testar (Modo Demo)</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center;">
        <div class="loader"></div>
        <h3 style="color: var(--gold)">Invocando Monstros...</h3>
        <p>A IA está lendo o PDF e criando perguntas.</p>
    </div>

    <div id="game-map-container">
        <p style="text-align: center; color: var(--gold); margin-bottom: 20px; font-size: 0.9rem;">⬇ CLIQUE NOS CARDS PARA JOGAR ⬇</p>
        <div id="map-wrapper" class="map-wrapper"></div>
        <div style="text-align: center; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <button onclick="location.reload()" style="width: auto; padding: 10px 40px; box-shadow: 0 0 20px #000;">Nova Aventura</button>
        </div>
    </div>

    <div class="modal-overlay" id="battleModal" onclick="closeModal(event)">
        <div class="battle-card" id="battleCard" onclick="event.stopPropagation()">
            <div class="node-icon" id="modalIcon">⚔️</div>
            <h2 class="battle-title" id="modalTitle">Título do Inimigo</h2>
            <p class="battle-question" id="modalQuestion">A pergunta aparecerá aqui...</p>
            
            <div id="optionsContainer">
                </div>

            <div id="feedbackArea" style="margin-top: 15px; height: 30px; font-weight: bold;"></div>

            <button class="close-btn" onclick="toggleModal(false)">Fugir da Batalha (Fechar)</button>
        </div>
    </div>

<script>
    // --- 1. LEITURA DE PDF ---
    let pdfRawText = "";

    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5); 
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + " ";
            }
            return fullText;
        } catch (e) {
            console.error(e);
            alert("Erro ao ler PDF. Tente outro arquivo.");
            return "";
        }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const textArea = document.getElementById('classContent');
        textArea.value = "⏳ Lendo arquivo...";
        
        if (file.type === "application/pdf") {
            pdfRawText = await readPDF(file);
            textArea.value = pdfRawText || "Erro: PDF vazio ou ilegível.";
        } else {
            const reader = new FileReader();
            reader.onload = function(e) {
                pdfRawText = e.target.result;
                textArea.value = e.target.result;
            };
            reader.readAsText(file);
        }
    });

    // --- 2. IA E GERAÇÃO ---
    let currentAdventureData = []; // Guarda os dados para usar no modal

    async function generateAdventure(useRealAI) {
        const content = document.getElementById('classContent').value;
        const apiKey = document.getElementById('apiKey').value;
        
        if (!content && useRealAI) { alert("O campo de texto está vazio!"); return; }
        if (useRealAI && !apiKey) { alert("Cole a API Key!"); return; }

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        if (useRealAI) {
            try {
                const prompt = `
                Atue como Game Master. Texto Base: "${content.substring(0, 3000)}"
                Crie 4 fases (3 inimigos + 1 Boss). Retorne APENAS JSON puro:
                [
                    {"title": "Nome Criativo", "desc": "Contexto curto", "type": "enemy", "question": "Pergunta Quiz", "options": ["Opção A","Opção B","Opção C"], "correct": 1},
                    {"title": "Nome do Boss", "desc": "Contexto curto", "type": "boss", "question": "Pergunta Difícil", "options": [], "correct": "Gabarito esperado"}
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error("Erro API");
                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;
                const jsonClean = textResponse.replace(/```json|```/g, '').trim();
                currentAdventureData = JSON.parse(jsonClean);

            } catch (error) {
                alert("Erro na IA: " + error.message + "\nUsando Demo.");
                currentAdventureData = getDemoData();
            }
        } else {
            await new Promise(r => setTimeout(r, 1500));
            currentAdventureData = getDemoData();
        }

        renderMap(currentAdventureData);
    }

    // --- 3. RENDERIZAÇÃO DO MAPA ---
    function renderMap(data) {
        const wrapper = document.getElementById('map-wrapper');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('game-map-container').style.display = 'block';
        wrapper.innerHTML = '';

        data.forEach((node, index) => {
            if (index > 0) {
                const conn = document.createElement('div');
                conn.className = 'connector';
                wrapper.appendChild(conn);
            }

            const card = document.createElement('div');
            card.className = `node-card ${node.type === 'boss' ? 'boss-card' : ''}`;
            // Ao clicar, abre o Modal com o índice da questão
            card.onclick = () => openBattle(index); 

            let icon = node.type === 'boss' ? '👑' : '⚔️';

            card.innerHTML = `
                <div class="node-icon">${icon}</div>
                <h3 style="margin:0; color: var(--gold)">${node.title}</h3>
                <p style="font-size:0.85rem; color:#aaa">${node.desc}</p>
                <div style="font-size:0.7rem; color:#666; margin-top:10px;">(Clique para Jogar)</div>
            `;
            wrapper.appendChild(card);
        });
    }

    // --- 4. SISTEMA DE BATALHA (MODAL) ---
    function openBattle(index) {
        const node = currentAdventureData[index];
        const modal = document.getElementById('battleModal');
        const container = document.getElementById('optionsContainer');
        const feedback = document.getElementById('feedbackArea');

        // Preenche dados
        document.getElementById('modalTitle').innerText = node.title;
        document.getElementById('modalQuestion').innerText = node.question;
        document.getElementById('modalIcon').innerText = node.type === 'boss' ? '👑' : '⚔️';
        feedback.innerText = "";
        container.innerHTML = "";

        // Se for Boss (Sem opções)
        if (node.type === 'boss' || !node.options || node.options.length === 0) {
            container.innerHTML = `<div style="color: #aaa; font-style: italic;">Este é um desafio dissertativo.<br>Gabarito sugerido: "${node.correct}"</div>`;
        } else {
            // Gera botões de opções
            node.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, i, node.correct);
                container.appendChild(btn);
            });
        }

        toggleModal(true);
    }

    function checkAnswer(btn, selectedIndex, correctIndex) {
        const feedback = document.getElementById('feedbackArea');
        const allBtns = document.querySelectorAll('.option-btn');

        // Trava cliques extras
        allBtns.forEach(b => b.onclick = null);

        if (selectedIndex === correctIndex) {
            btn.classList.add('correct');
            feedback.innerText = "✨ ACERTO CULT! (Dano Crítico)";
            feedback.style.color = "var(--green)";
        } else {
            btn.classList.add('wrong');
            // Mostra qual era a certa
            allBtns[correctIndex].classList.add('correct');
            feedback.innerText = "❌ ERROU... (Você tomou dano)";
            feedback.style.color = "var(--red)";
        }
    }

    function toggleModal(show) {
        const modal = document.getElementById('battleModal');
        const card = document.getElementById('battleCard');
        if (show) {
            modal.classList.add('show-modal');
            setTimeout(() => card.classList.add('show-card'), 10);
        } else {
            card.classList.remove('show-card');
            setTimeout(() => modal.classList.remove('show-modal'), 300);
        }
    }

    function closeModal(e) {
        if (e.target.id === 'battleModal') toggleModal(false);
    }

    function getDemoData() {
        return [
            { title: "Goblin do Teste", desc: "Aquecimento", type: "enemy", question: "Quanto é 2 + 2?", options: ["3", "4", "5"], correct: 1 },
            { title: "Rei Demo", desc: "Chefe final", type: "boss", question: "Qual o sentido da vida?", options: [], correct: "42" }
        ];
    }
</script>

</body>
</html>
