<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Prototype - Full Game</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        /* --- TEMA LEGENDS OF RUNETERRA --- */
        :root {
            --bg-color: #0b0c15; 
            --card-bg: #1e2328;
            --gold: #c8aa6e;     
            --blue: #0ac8b9;     
            --red: #ff4444;
            --green: #4cd137;
            --text: #f0f0f0;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        /* BARRA DE VIDA (NOVIDADE) */
        .hud-bar {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.8);
            padding: 10px 20px;
            border: 2px solid var(--gold);
            border-radius: 8px;
            display: none; /* Aparece só quando o jogo começa */
            align-items: center; gap: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        
        .hp-container {
            width: 200px; height: 20px; background: #333;
            border-radius: 10px; overflow: hidden; border: 1px solid #555;
        }
        
        .hp-fill {
            width: 100%; height: 100%;
            background: linear-gradient(90deg, #ff4444, #ff8888);
            transition: width 0.5s cubic-bezier(0.4, 0, 0.2, 1);
        }

        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }

        /* PAINEL DE CONFIGURAÇÃO */
        .config-panel {
            background: rgba(30, 35, 40, 0.95);
            border: 1px solid #444;
            padding: 30px;
            border-radius: 8px;
            width: 100%; max-width: 600px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            z-index: 10; transition: all 0.5s;
        }

        input, textarea { 
            width: 100%; box-sizing: border-box; 
            background: #121212; border: 1px solid #444; color: #fff; 
            padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px;
        }
        
        button {
            background: linear-gradient(45deg, #b38936, #f5d67b);
            color: #1a1a1a; font-weight: bold; border: 1px solid var(--gold);
            padding: 12px 25px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-bottom: 10px; transition: all 0.2s;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-demo { background: #333; color: #aaa; border: 1px solid #555; }

        /* MAPA */
        #game-map-container {
            width: 100%; overflow-x: auto; padding: 50px 20px;
            display: none; white-space: nowrap; 
            scrollbar-width: thin; scrollbar-color: var(--gold) var(--bg-color);
        }

        .map-wrapper { display: inline-flex; align-items: center; gap: 40px; padding-bottom: 20px; }

        .node-card {
            display: inline-block; vertical-align: top; width: 220px;
            white-space: normal; background: var(--card-bg);
            border: 2px solid #444; border-radius: 8px; padding: 20px;
            position: relative; transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; text-align: center;
        }
        
        .node-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        
        /* Estado: COMPLETO (Verde) */
        .node-cleared { border-color: var(--green) !important; opacity: 0.7; filter: grayscale(0.5); }
        .node-cleared::after {
            content: "✔ DERROTADO"; position: absolute; top: 10px; right: 10px;
            font-size: 0.7rem; background: var(--green); color: #000; padding: 2px 5px; border-radius: 4px; font-weight: bold;
        }

        .node-icon {
            width: 60px; height: 60px; background: #111; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 15px auto;
            border: 2px solid var(--gold);
        }

        .boss-card .node-icon { border-color: var(--red); box-shadow: 0 0 15px var(--red); }
        .connector { display: inline-block; width: 40px; height: 2px; background: #555; margin: 0 -10px; }

        /* MODAL DE BATALHA */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.85); backdrop-filter: blur(5px);
            display: none; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        
        .battle-card {
            background: #1e2328; border: 2px solid var(--gold);
            width: 90%; max-width: 500px; padding: 30px;
            border-radius: 12px; text-align: center;
            box-shadow: 0 0 50px rgba(200, 170, 110, 0.2);
            transform: scale(0.8); transition: transform 0.3s;
        }

        .option-btn {
            display: block; width: 100%; background: #2a2e35; border: 1px solid #444;
            padding: 15px; margin: 10px 0; color: #fff; text-align: left;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .option-btn:hover { background: #3a3e45; border-color: var(--gold); }
        .correct { background: #1a4a1a !important; border-color: var(--green) !important; color: var(--green) !important; }
        .wrong { background: #4a1a1a !important; border-color: var(--red) !important; animation: shake 0.4s; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }
        
        .hidden { display: none !important; }
        .show-modal { display: flex; opacity: 1; }
        .show-card { transform: scale(1); }
        
        /* Loading */
        .loader { border: 5px solid #333; border-top: 5px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="game-hud" class="hud-bar">
        <span>❤️ HP Aluno:</span>
        <div class="hp-container">
            <div id="hp-bar" class="hp-fill"></div>
        </div>
        <span id="hp-text">100/100</span>
    </div>

    <header style="text-align: center;">
        <h1>🛡️ Class Forge 🛡️</h1>
        <p style="color: #666; font-size: 0.9rem;">PROTOTIPO FINAL - MODO JOGO</p>
    </header>

    <div class="config-panel" id="setup-panel">
        <label>1. Carregar Conteúdo (PDF/Txt)</label>
        <input type="file" id="fileInput" accept=".pdf, .txt">
        <textarea id="classContent" placeholder="Conteúdo da aula..."></textarea>
        
        <label>2. Chave API (Gemini)</label>
        <input type="password" id="apiKey" placeholder="Cole sua API Key NOVA aqui">
        
        <button onclick="startGame(true)">🔮 Criar Jogo (IA)</button>
        <button class="btn-demo" onclick="startGame(false)">🎲 Modo Demo</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center;">
        <div class="loader"></div>
        <h3>Preparando o tabuleiro...</h3>
    </div>

    <div id="game-map-container">
        <div id="map-wrapper" class="map-wrapper"></div>
        <div style="text-align: center; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <button onclick="location.reload()" style="width: auto; padding: 10px 40px; box-shadow: 0 0 20px #000;">Reiniciar</button>
        </div>
    </div>

    <div class="modal-overlay" id="battleModal" onclick="closeModal(event)">
        <div class="battle-card" id="battleCard" onclick="event.stopPropagation()">
            <div class="node-icon" id="modalIcon">⚔️</div>
            <h2 id="modalTitle" style="color:var(--gold)">Título</h2>
            <p id="modalQuestion" style="font-size: 1.1rem; margin-bottom: 20px;">Pergunta...</p>
            <div id="optionsContainer"></div>
            <div id="feedbackArea" style="margin-top: 15px; font-weight: bold; min-height: 25px;"></div>
            <button onclick="toggleModal(false)" style="margin-top: 20px; background: transparent; border: 1px solid #555; color: #888; width: auto;">Fechar</button>
        </div>
    </div>

<script>
    // --- ESTADO DO JOGO ---
    let playerHP = 100;
    let maxHP = 100;
    let adventureData = [];

    // --- 1. LEITURA PDF ---
    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5);
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                fullText += textContent.items.map(item => item.str).join(" ") + " ";
            }
            return fullText;
        } catch (e) { return ""; }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file && file.type === "application/pdf") {
            document.getElementById('classContent').value = "⏳ Lendo PDF...";
            document.getElementById('classContent').value = await readPDF(file);
        }
    });

    // --- 2. LÓGICA DO JOGO ---
    async function startGame(useRealAI) {
        const content = document.getElementById('classContent').value;
        const apiKey = document.getElementById('apiKey').value;

        if (!content && useRealAI) return alert("Faltou o conteúdo!");
        if (useRealAI && !apiKey) return alert("Faltou a Key!");

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        if (useRealAI) {
            try {
                const prompt = `Atue como Game Master. Texto Base: "${content.substring(0, 3000)}".
                Crie 4 desafios (3 inimigos + 1 Boss). Retorne JSON puro:
                [
                    {"title": "Nome Criativo", "desc": "Contexto", "type": "enemy", "question": "Pergunta Quiz", "options": ["A","B","C"], "correct": 1},
                    {"title": "Nome do Boss", "desc": "Contexto", "type": "boss", "question": "Pergunta Final", "options": [], "correct": "Resposta"}
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const jsonStr = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonStr);

            } catch (error) {
                alert("Erro na IA. Usando Demo.");
                adventureData = getDemoData();
            }
        } else {
            await new Promise(r => setTimeout(r, 1000));
            adventureData = getDemoData();
        }

        // Adiciona estado de "completado" aos dados
        adventureData.forEach(node => node.completed = false);

        document.getElementById('loading').classList.add('hidden');
        document.getElementById('game-map-container').style.display = 'block';
        document.getElementById('game-hud').style.display = 'flex';
        renderMap();
    }

    // --- 3. RENDERIZAÇÃO INTELIGENTE ---
    function renderMap() {
        const wrapper = document.getElementById('map-wrapper');
        wrapper.innerHTML = '';

        adventureData.forEach((node, index) => {
            if (index > 0) {
                const conn = document.createElement('div');
                conn.className = 'connector';
                wrapper.appendChild(conn);
            }

            const card = document.createElement('div');
            // Adiciona classe se já foi completado
            card.className = `node-card ${node.type === 'boss' ? 'boss-card' : ''} ${node.completed ? 'node-cleared' : ''}`;
            
            // Só permite clicar se NÃO foi completado
            if (!node.completed) {
                card.onclick = () => openBattle(index);
            }

            let icon = node.type === 'boss' ? '👑' : '⚔️';
            card.innerHTML = `
                <div class="node-icon">${icon}</div>
                <h3 style="margin:0; color: var(--gold)">${node.title}</h3>
                <p style="font-size:0.85rem; color:#aaa">${node.desc}</p>
            `;
            wrapper.appendChild(card);
        });
    }

    // --- 4. BATALHA E PROGRESSÃO ---
    let currentNodeIndex = -1;

    function openBattle(index) {
        currentNodeIndex = index;
        const node = adventureData[index];
        const container = document.getElementById('optionsContainer');
        
        document.getElementById('modalTitle').innerText = node.title;
        document.getElementById('modalQuestion').innerText = node.question;
        document.getElementById('feedbackArea').innerText = "";
        container.innerHTML = "";

        if (node.type === 'boss' || !node.options || node.options.length === 0) {
            container.innerHTML = `<div style="color:#aaa"><em>Pergunta aberta. O professor deve validar.</em><br><br><strong>Gabarito:</strong> ${node.correct}</div>
            <button class="option-btn" onclick="resolveBattle(true)">✅ Validar Resposta (Vitória)</button>`;
        } else {
            node.options.forEach((opt, i) => {
                const btn = document.createElement('button');
                btn.className = 'option-btn';
                btn.innerText = opt;
                btn.onclick = () => checkAnswer(btn, i, node.correct);
                container.appendChild(btn);
            });
        }
        toggleModal(true);
    }

    function checkAnswer(btn, selected, correct) {
        // Bloqueia cliques múltiplos
        document.querySelectorAll('.option-btn').forEach(b => b.onclick = null);

        if (selected === correct) {
            btn.classList.add('correct');
            document.getElementById('feedbackArea').innerText = "⚔️ CRITICAL HIT! Inimigo derrotado!";
            document.getElementById('feedbackArea').style.color = "var(--green)";
            
            // Delay para fechar e atualizar mapa
            setTimeout(() => resolveBattle(true), 1500);
        } else {
            btn.classList.add('wrong');
            document.getElementById('feedbackArea').innerText = "🩸 ERROU! Você tomou 25 de dano!";
            document.getElementById('feedbackArea').style.color = "var(--red)";
            updateHP(-25);
            
            // Mostra a certa
            document.querySelectorAll('.option-btn')[correct].classList.add('correct');
            
            // Fecha modal após delay (mas não marca como completo)
            setTimeout(() => toggleModal(false), 2000);
        }
    }

    function resolveBattle(victory) {
        if (victory) {
            adventureData[currentNodeIndex].completed = true;
            renderMap(); // Redesenha o mapa para atualizar status
            toggleModal(false);
            
            // Checar Vitória Total
            if (adventureData.every(n => n.completed)) {
                setTimeout(() => alert("🏆 PARABÉNS! Você completou a jornada!"), 500);
            }
        }
    }

    function updateHP(amount) {
        playerHP += amount;
        if (playerHP < 0) playerHP = 0;
        
        // Atualiza Barra Visual
        const pct = (playerHP / maxHP) * 100;
        document.getElementById('hp-bar').style.width = pct + "%";
        document.getElementById('hp-text').innerText = playerHP + "/" + maxHP;

        if (playerHP === 0) {
            setTimeout(() => {
                alert("💀 GAME OVER! A aula foi muito difícil...");
                location.reload();
            }, 500);
        }
    }

    function toggleModal(show) {
        const modal = document.getElementById('battleModal');
        const card = document.getElementById('battleCard');
        if (show) {
            modal.classList.add('show-modal');
            setTimeout(() => card.classList.add('show-card'), 10);
        } else {
            card.classList.remove('show-card');
            setTimeout(() => modal.classList.remove('show-modal'), 300);
        }
    }
    
    function closeModal(e) { if (e.target.id === 'battleModal') toggleModal(false); }
    function getDemoData() {
        return [
            { title: "Teste 1", desc: "Fácil", type: "enemy", question: "1+1?", options: ["11", "2", "0"], correct: 1 },
            { title: "Boss", desc: "Hard", type: "boss", question: "Fim?", correct: "Sim" }
        ];
    }
</script>
</body>
</html>
