<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gerador de Jornada RPG - Prototipo</title>
    <style>
        :root {
            --bg-color: #1a1a2e;
            --card-bg: #16213e;
            --accent: #e94560;
            --text: #fff;
        }
        body { font-family: 'Segoe UI', sans-serif; background: var(--bg-color); color: var(--text); padding: 20px; text-align: center; }
        .container { max-width: 800px; margin: 0 auto; }
        

        .input-box { background: var(--card-bg); padding: 20px; border-radius: 10px; margin-bottom: 20px; border: 1px solid #444; }
        textarea { width: 100%; height: 100px; background: #0f3460; color: #fff; border: none; padding: 10px; margin-top: 10px; border-radius: 5px; }
        input[type="text"], input[type="password"] { width: 70%; padding: 10px; border-radius: 5px; border: none; margin-top: 10px; }
        
 
        button { cursor: pointer; background: var(--accent); color: white; border: none; padding: 12px 24px; font-size: 1rem; border-radius: 5px; transition: 0.3s; margin: 10px; }
        button:hover { opacity: 0.9; transform: scale(1.05); }
        .secondary-btn { background: #533483; }


        #game-map { display: none; margin-top: 30px; text-align: left; }
        .node { background: #0f3460; padding: 15px; margin: 10px 0; border-left: 5px solid var(--accent); animation: fadeIn 0.5s; }
        .node h3 { margin: 0; color: var(--accent); }
        .node p { font-size: 0.9rem; color: #ccc; }
        .boss-node { border-left-color: #ffd700; background: #2a2a1a; }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h1>⚔️ Forge Your Class ⚔️</h1>
    <p>Transforme seu plano de aula em uma Jornada Épica.</p>

    <div class="input-box" id="setup-panel">
        <h3>1. Conteúdo da Aula</h3>
        <p>Cole o texto da aula ou suba um arquivo .txt</p>
        <input type="file" id="fileInput" accept=".txt">
        <textarea id="classContent" placeholder="Ex: A Revolução Francesa foi um período de intensa agitação política e social na França..."></textarea>
        
        <h3>2. Configuração da IA</h3>
        <input type="password" id="apiKey" placeholder="Cole sua API Key do Google Gemini aqui (Opcional no Modo Demo)">
        <br>
        <button onclick="generateAdventure(true)">🎲 Gerar com IA Real</button>
        <button class="secondary-btn" onclick="generateAdventure(false)">🛡️ Modo Demo (Segurança)</button>
    </div>

    <div id="loading" class="hidden">
        <h2>🔨 Forjando a aventura...</h2>
        <p>A IA está criando monstros baseados no seu texto...</p>
    </div>

    <div id="game-map">
        <h2>🗺️ Mapa da Jornada Gerado</h2>
        <div id="nodes-container"></div>
        <button class="secondary-btn" onclick="location.reload()">Criar Nova Jornada</button>
    </div>
</div>

<script>

    document.getElementById('fileInput').addEventListener('change', function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = function(e) {
            document.getElementById('classContent').value = e.target.result;
        };
        reader.readAsText(file);
    });

    async function generateAdventure(useRealAI) {
        const content = document.getElementById('classContent').value;
        const apiKey = document.getElementById('apiKey').value;
        const container = document.getElementById('nodes-container');
        
        if (!content && useRealAI) { alert("Por favor, insira um conteúdo para a aula!"); return; }
        if (useRealAI && !apiKey) { alert("Para usar a IA Real, você precisa de uma API Key!"); return; }


        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        let adventureData = [];

        if (useRealAI) {
            try {
   
                const prompt = `Você é um Game Master. Transforme o seguinte texto educacional em uma jornada de RPG de 3 etapas + 1 Chefe.
                Texto: "${content.substring(0, 1000)}"
                Responda APENAS com um JSON neste formato:
                [
                    {"title": "Nome do Desafio", "desc": "Descrição rpgística curta relacionando com o tema", "type": "enemy"},
                    {"title": "Nome do Chefe", "desc": "O desafio final difícil", "type": "boss"}
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;
              
                const jsonStr = textResponse.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonStr);

            } catch (error) {
                console.error(error);
                alert("Erro na IA Real. Ativando protocolo de emergência (Modo Demo).");
                adventureData = getDemoData();
            }
        } else {
            // Simulação (Atraso para parecer que está pensando)
            await new Promise(r => setTimeout(r, 1500));
            adventureData = getDemoData();
        }

        // Renderizar
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('game-map').style.display = 'block';
        container.innerHTML = '';

        adventureData.forEach((node, index) => {
            const div = document.createElement('div');
            div.className = `node ${node.type === 'boss' ? 'boss-node' : ''}`;
            div.innerHTML = `
                <h3>${index + 1}. ${node.title} ${node.type === 'boss' ? '👑' : '⚔️'}</h3>
                <p>${node.desc}</p>
            `;
            container.appendChild(div);
        });
    }

    function getDemoData() {
        return [
            { title: "O Vale dos Esquecidos", desc: "Responda 3 perguntas sobre o contexto histórico para atravessar a névoa.", type: "enemy" },
            { title: "A Esfinge do Conhecimento", desc: "Um guardião bloqueia o caminho. Relacione os conceitos corretamente para causar dano.", type: "enemy" },
            { title: "O Labirinto Lógico", desc: "O caminho se divide. Escolha a afirmação verdadeira para não cair na armadilha.", type: "enemy" },
            { title: "O Lorde da Ignorância", desc: "Teste final! Escreva uma dissertação curta para banir o Lorde para sempre.", type: "boss" }
        ];
    }
</script>

</body>
</html>
