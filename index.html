<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Class Forge V11 - Castle Edition</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        /* --- TEMA LEGENDS OF RUNETERRA --- */
        :root {
            --bg-color: #0b0c15; 
            --card-bg: #1e2328;
            --gold: #c8aa6e;     
            --blue: #0ac8b9;     
            --red: #ff4444;
            --green: #4cd137;
            --text: #f0f0f0;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            color: var(--text); 
            margin: 0; padding: 20px;
            display: flex; flex-direction: column; align-items: center;
            min-height: 100vh;
            
            /* --- NOVO BACKGROUND: PAREDE DE CASTELO --- */
            background-color: #0b0c15;
            background-image: 
                linear-gradient(335deg, #13141f 23px, transparent 23px),
                linear-gradient(155deg, #13141f 23px, transparent 23px),
                linear-gradient(335deg, #13141f 23px, transparent 23px),
                linear-gradient(155deg, #13141f 23px, transparent 23px);
            background-size: 58px 58px;
            background-position: 0px 2px, 4px 35px, 29px 31px, 34px 6px;
            /* Vinheta escura nas bordas pra dar clima */
            box-shadow: inset 0 0 150px #000; 
        }

        /* HUD */
        .hud-bar {
            position: fixed; top: 20px; right: 20px; z-index: 100;
            background: rgba(0,0,0,0.9); padding: 10px 20px;
            border: 2px solid var(--gold); border-radius: 8px;
            display: none; align-items: center; gap: 10px;
            box-shadow: 0 0 20px rgba(0,0,0,0.5);
        }
        .hp-container { width: 200px; height: 20px; background: #333; border-radius: 10px; overflow: hidden; }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #ff4444, #ff8888); transition: width 0.5s; }

        h1 { 
            color: var(--gold); text-transform: uppercase; letter-spacing: 2px; 
            border-bottom: 2px solid var(--gold); padding-bottom: 10px; 
            text-shadow: 0 0 10px rgba(200, 170, 110, 0.3);
            background: rgba(0,0,0,0.6); /* Fundo para ler melhor no castelo */
            padding: 10px 20px; border-radius: 4px;
        }

        /* PAINEL CONFIG */
        .config-panel {
            background: rgba(25, 30, 35, 0.95); border: 1px solid #444;
            padding: 30px; border-radius: 8px; width: 100%; max-width: 600px;
            box-shadow: 0 0 30px rgba(0,0,0,0.8); z-index: 10; transition: all 0.5s;
        }

        label { display: block; margin-top: 15px; color: var(--gold); font-size: 0.9rem; font-weight: bold; }
        
        input, textarea, select { 
            width: 100%; box-sizing: border-box; 
            background: #121212; border: 1px solid #444; color: #fff; 
            padding: 10px; margin-top: 5px; margin-bottom: 5px; border-radius: 4px;
        }
        
        button {
            background: linear-gradient(45deg, #b38936, #f5d67b);
            color: #1a1a1a; font-weight: bold; border: 1px solid var(--gold);
            padding: 12px 25px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-top: 20px; margin-bottom: 5px; transition: all 0.2s;
        }
        button:hover { filter: brightness(1.2); transform: translateY(-2px); }
        .btn-demo { background: #333; color: #aaa; border: 1px solid #555; margin-top: 10px; }

        /* MAPA */
        #game-map-container {
            width: 100%; overflow-x: auto; padding: 50px 20px;
            display: none; white-space: nowrap; 
            scrollbar-width: thin; scrollbar-color: var(--gold) var(--bg-color);
        }
        .map-wrapper { display: inline-flex; align-items: center; gap: 40px; padding-bottom: 20px; }

        .node-card {
            display: inline-block; vertical-align: top; width: 220px;
            white-space: normal; background: var(--card-bg);
            border: 2px solid #444; border-radius: 8px; padding: 20px;
            position: relative; transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5); cursor: pointer; text-align: center;
        }
        .node-card:hover { transform: translateY(-10px); border-color: var(--gold); }
        /* Quando o sistema estiver ocupado, bloqueia clicks */
        body.busy .node-card { pointer-events: none; opacity: 0.8; }
        
        .node-cleared { border-color: var(--green) !important; opacity: 0.7; filter: grayscale(0.8); pointer-events: none; }
        
        .node-icon {
            width: 60px; height: 60px; background: #111; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 30px; margin: 0 auto 15px auto;
            border: 2px solid var(--gold);
        }
        .boss-card .node-icon { border-color: var(--red); box-shadow: 0 0 15px var(--red); }
        .connector { display: inline-block; width: 40px; height: 2px; background: #555; margin: 0 -10px; }

        /* MODAL */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0, 0, 0, 0.9); backdrop-filter: blur(8px);
            display: none; justify-content: center; align-items: center;
            z-index: 200; opacity: 0; transition: opacity 0.3s;
        }
        
        .battle-card {
            background: #1e2328; border: 2px solid var(--gold);
            width: 90%; max-width: 600px; max-height: 85vh;
            display: flex; flex-direction: column; 
            padding: 30px;
            border-radius: 12px; text-align: center;
            box-shadow: 0 0 50px rgba(200, 170, 110, 0.3);
            transform: scale(0.9); transition: transform 0.3s;
        }

        .battle-content-scroll {
            overflow-y: auto; padding-right: 10px; margin-top: 10px;
        }

        .battle-content-scroll::-webkit-scrollbar { width: 8px; }
        .battle-content-scroll::-webkit-scrollbar-track { background: #111; }
        .battle-content-scroll::-webkit-scrollbar-thumb { background: var(--gold); border-radius: 4px; }

        .battle-title { color: var(--gold); font-size: 1.5rem; margin-bottom: 10px; text-transform: uppercase; }
        
        .combat-choice-btn {
            width: 48%; display: inline-block; margin: 1%;
            padding: 20px; background: #2a2e35; border: 1px solid #555;
            color: white; font-size: 1rem; border-radius: 8px; cursor: pointer;
        }
        .combat-choice-btn:hover { background: #3a3e45; border-color: var(--gold); }
        
        .option-btn {
            display: block; width: 100%; background: #2a2e35; border: 1px solid #444;
            padding: 15px; margin: 10px 0; color: #fff; text-align: left;
            border-radius: 6px; cursor: pointer; transition: 0.2s;
        }
        .option-btn:hover { background: #3a3e45; border-color: var(--gold); }
        .correct { background: #1a4a1a !important; border-color: var(--green) !important; color: var(--green) !important; }
        .wrong { background: #4a1a1a !important; border-color: var(--red) !important; animation: shake 0.4s; }

        @keyframes shake { 0% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } 100% { transform: translateX(0); } }
        
        .hidden { display: none !important; }
        .show-modal { display: flex; opacity: 1; }
        .show-card { transform: scale(1); }
        
        .loader { border: 5px solid #333; border-top: 5px solid var(--gold); border-radius: 50%; width: 40px; height: 40px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="game-hud" class="hud-bar">
        <span>❤️ HP:</span>
        <div class="hp-container">
            <div id="hp-bar" class="hp-fill"></div>
        </div>
        <span id="hp-text">100/100</span>
    </div>

    <header style="text-align: center;">
        <h1>🛡️ Class Forge V11 🛡️</h1>
        <p style="color: #ccc; font-size: 0.9rem; text-shadow: 1px 1px 2px black;">CASTLE EDITION</p>
    </header>

    <div class="config-panel" id="setup-panel">
        <label>1. Escolha a Matéria</label>
        <select id="subject">
            <option value="">-- Modo Livre (Apenas o conteúdo do PDF) --</option>
            <option value="História">📜 História</option>
            <option value="Matemática">📐 Matemática</option>
            <option value="Geografia">🌍 Geografia</option>
            <option value="Biologia">🧬 Biologia</option>
            <option value="Física">⚡ Física</option>
            <option value="Química">🧪 Química</option>
            <option value="Literatura">📚 Literatura</option>
            <option value="Inglês">💂 Inglês</option>
            <option value="Tecnologia">💻 Tecnologia</option>
            <option value="Geral">🧠 Conhecimentos Gerais</option>
        </select>

        <label>2. Carregar PDF (Obrigatório se "Modo Livre")</label>
        <input type="file" id="fileInput" accept=".pdf, .txt">
        <textarea id="classContent" placeholder="Texto base..."></textarea>
        
        <label>3. Dificuldade</label>
        <select id="difficulty">
            <option value="3">Fácil (3 Fases)</option>
            <option value="5" selected>Médio (5 Fases)</option>
            <option value="7">Difícil (7 Fases)</option>
        </select>

        <label>4. Chave API (Gemini)</label>
        <input type="password" id="apiKey" placeholder="Cole sua API Key aqui">
        
        <button onclick="startGame(true)">🔮 Iniciar Jornada</button>
        <button class="btn-demo" onclick="startGame(false)">🎲 Modo Demo</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center;">
        <div class="loader"></div>
        <h3 style="color: var(--gold)">Construindo a Masmorra...</h3>
    </div>

    <div id="game-map-container">
        <div id="map-wrapper" class="map-wrapper"></div>
        <div style="text-align: center; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%); z-index: 50;">
            <button onclick="location.reload()" style="width: auto; padding: 10px 40px; box-shadow: 0 0 20px #000;">Reiniciar</button>
        </div>
    </div>

    <div class="modal-overlay" id="battleModal">
        <div class="battle-card" id="battleCard">
            <div class="node-icon" id="modalIcon">⚔️</div>
            <h2 id="modalTitle" class="battle-title">Inimigo</h2>
            
            <div class="battle-content-scroll">
                <div id="choiceScreen">
                    <p style="margin-bottom: 20px;">Escolha sua estratégia:</p>
                    <button class="combat-choice-btn" onclick="chooseCombatMode('quiz')">
                        ⚔️ <strong>Ataque Físico</strong><br>
                        <span style="font-size:0.8rem; color:#aaa;">Quiz Múltipla Escolha</span>
                    </button>
                    <button class="combat-choice-btn" onclick="chooseCombatMode('magic')">
                        ✨ <strong>Magia Arcana</strong><br>
                        <span style="font-size:0.8rem; color:#aaa;">Verdadeiro ou Falso</span>
                    </button>
                </div>

                <div id="questionScreen" class="hidden">
                    <p id="modalQuestion" style="font-size: 1.1rem; margin-bottom: 20px; text-align: left; line-height: 1.6;">Pergunta...</p>
                    <div id="optionsContainer"></div>
                    <div id="feedbackArea" style="margin-top: 15px; font-weight: bold; min-height: 25px;"></div>
                    <button onclick="closeBattleModal()" style="margin-top: 20px; background: transparent; border: 1px solid #555; color: #888; width: auto; font-size: 0.8rem;">Desistir / Fechar</button>
                </div>
            </div>
        </div>
    </div>

<script>
    const mapContainer = document.getElementById('game-map-container');
    mapContainer.addEventListener('wheel', (evt) => {
        evt.preventDefault();
        mapContainer.scrollLeft += evt.deltaY;
    });

    let playerHP = 100;
    let maxHP = 100;
    let adventureData = [];
    let currentEnemyIndex = -1;
    let isBusy = false; 

    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5);
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                fullText += (await page.getTextContent()).items.map(i => i.str).join(" ") + " ";
            }
            return fullText;
        } catch (e) { return ""; }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file && file.type === "application/pdf") {
            document.getElementById('classContent').value = "⏳ Lendo PDF...";
            document.getElementById('classContent').value = await readPDF(file);
        }
    });

    async function startGame(useRealAI) {
        const content = document.getElementById('classContent').value;
        const apiKey = document.getElementById('apiKey').value;
        const difficulty = document.getElementById('difficulty').value;
        const subject = document.getElementById('subject').value;

        // VALIDAÇÃO DE MODO LIVRE
        if (subject === "" && (!content || content.length < 50 || content === "⏳ Lendo PDF...")) {
            alert("⚠️ Atenção!\n\nNo 'Modo Livre', você PRECISA carregar um PDF ou colar um texto.\nA IA não tem como inventar questões sem uma matéria ou um texto base.");
            return;
        }

        if (useRealAI && !apiKey) return alert("Faltou a Key!");

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        const totalNodes = parseInt(difficulty);
        const enemiesCount = totalNodes - 1;

        if (useRealAI) {
            try {
                let contextInstruction = "";
                
                // LÓGICA DE CONTEXTO REFINADA
                if (subject === "") {
                    // MODO LIVRE
                    contextInstruction = `O usuário NÃO escolheu uma matéria específica. Use EXCLUSIVAMENTE o texto base fornecido abaixo para criar as perguntas. Não invente nada fora deste texto.\nTexto Base: "${content.substring(0, 3000)}"`;
                } else if (content && content.length > 50) {
                    // MODO HÍBRIDO
                    contextInstruction = `Use o texto base abaixo, mas filtre e foque no contexto da matéria de ${subject}.\nTexto Base: "${content.substring(0, 3000)}"`;
                } else {
                    // MODO SÓ MATÉRIA
                    contextInstruction = `Não há texto base. Crie questões baseadas apenas no seu conhecimento sobre a matéria: ${subject}.`;
                }

                const prompt = `Atue como Game Master.
                ${contextInstruction}
                Gere uma jornada com ${enemiesCount} Inimigos e 1 Boss.
                Para cada inimigo, crie DOIS modos: "quiz" (Múltipla Escolha) e "magic" (Verdadeiro ou Falso).
                Retorne JSON puro:
                [
                    {
                        "title": "Nome Inimigo", "desc": "Contexto", "type": "enemy",
                        "quiz": { "question": "Pergunta", "options": ["A","B","C"], "correct": 1 },
                        "magic": { "statement": "Afirmação", "is_true": true }
                    },
                    {
                        "title": "Boss", "type": "boss",
                        "quiz": { "question": "Pergunta Boss", "options": [], "correct": "Gabarito" } 
                    }
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const jsonStr = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonStr);

            } catch (error) {
                alert("Erro IA. Usando Demo.");
                adventureData = getDemoData(totalNodes);
            }
        } else {
            await new Promise(r => setTimeout(r, 1000));
            adventureData = getDemoData(totalNodes);
        }

        adventureData.forEach(node => node.completed = false);
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('game-map-container').style.display = 'block';
        document.getElementById('game-hud').style.display = 'flex';
        renderMap();
    }

    function renderMap() {
        const wrapper = document.getElementById('map-wrapper');
        wrapper.innerHTML = '';
        adventureData.forEach((node, index) => {
            if (index > 0) wrapper.appendChild(document.createElement('div')).className = 'connector';

            const card = document.createElement('div');
            card.className = `node-card ${node.type === 'boss' ? 'boss-card' : ''} ${node.completed ? 'node-cleared' : ''}`;
            
            card.onclick = () => {
                if (!isBusy && !node.completed) openBattle(index);
            };

            let levelText = index === adventureData.length - 1 ? "BOSS" : `NÍVEL ${index + 1}`;
            let icon = node.type === 'boss' ? '👑' : '⚔️';
            
            card.innerHTML = `
                <div class="node-icon">${icon}</div>
                <div style="font-size:0.7rem; color:#666; margin-bottom:5px;">${levelText}</div>
                <h3 style="margin:0; color: var(--gold)">${node.title}</h3>
                <p style="font-size:0.85rem; color:#aaa">${node.desc}</p>
            `;
            wrapper.appendChild(card);
        });
    }

    function openBattle(index) {
        if (isBusy) return; 
        currentEnemyIndex = index;
        const node = adventureData[index];
        document.getElementById('modalTitle').innerText = node.title;
        
        if(node.type === 'boss') {
            document.getElementById('choiceScreen').classList.add('hidden');
            document.getElementById('questionScreen').classList.remove('hidden');
            renderCombatOptions('boss');
        } else {
            resetBattleUI();
        }
        toggleModal(true);
    }

    function resetBattleUI() {
        document.getElementById('choiceScreen').classList.remove('hidden');
        document.getElementById('questionScreen').classList.add('hidden');
        document.getElementById('feedbackArea').innerText = "";
    }

    function chooseCombatMode(mode) {
        document.getElementById('choiceScreen').classList.add('hidden');
        document.getElementById('questionScreen').classList.remove('hidden');
        renderCombatOptions(mode);
    }

    function renderCombatOptions(mode) {
        const node = adventureData[currentEnemyIndex];
        const container = document.getElementById('optionsContainer');
        container.innerHTML = "";
        
        document.getElementById('feedbackArea').innerText = "";
        document.getElementById('feedbackArea').className = "";

        if (mode === 'quiz' || mode === 'boss') {
            const data = node.quiz;
            document.getElementById('modalQuestion').innerText = data.question;
            if (!data.options || data.options.length === 0) {
                 container.innerHTML = `<div style="color:#aaa; font-style:italic">Gabarito: ${data.correct}</div>
                 <button class="option-btn" onclick="resolveBattle(true)">✅ Validar Resposta</button>`;
            } else {
                data.options.forEach((opt, i) => {
                    const btn = document.createElement('button');
                    btn.className = 'option-btn'; btn.innerText = opt;
                    btn.onclick = () => checkAnswer(btn, i === data.correct, 'quiz');
                    container.appendChild(btn);
                });
            }
        } else if (mode === 'magic') {
            const data = node.magic;
            document.getElementById('modalQuestion').innerText = '"' + data.statement + '"';
            
            const btnTrue = document.createElement('button');
            btnTrue.className = 'option-btn'; btnTrue.innerText = "✨ Verdadeiro";
            btnTrue.onclick = () => checkAnswer(btnTrue, data.is_true === true, 'magic');
            
            const btnFalse = document.createElement('button');
            btnFalse.className = 'option-btn'; btnFalse.innerText = "🌑 Falso";
            btnFalse.onclick = () => checkAnswer(btnFalse, data.is_true === false, 'magic');
            
            container.appendChild(btnTrue); container.appendChild(btnFalse);
        }
    }

    function checkAnswer(btn, isCorrect, mode) {
        const allBtns = document.querySelectorAll('.option-btn');
        allBtns.forEach(b => b.onclick = null);

        if (isCorrect) {
            btn.classList.add('correct');
            document.getElementById('feedbackArea').innerText = "⚔️ VENCEU!";
            document.getElementById('feedbackArea').style.color = "var(--green)";
            
            isBusy = true;
            document.body.classList.add('busy');

            setTimeout(() => resolveBattle(true), 1500);
        } else {
            btn.classList.add('wrong');
            
            let msg = mode === 'magic' ? "🩸 FALHA NA MAGIA! (-15 HP)" : "🩸 ERROU! (-15 HP)";
            document.getElementById('feedbackArea').innerText = msg;
            document.getElementById('feedbackArea').style.color = "var(--red)";
            
            updateHP(-15);
            setTimeout(() => toggleModal(false), 2000);
        }
    }

    function resolveBattle(victory) {
        if (victory) {
            adventureData[currentEnemyIndex].completed = true;
            renderMap(); 
            toggleModal(false);
            
            isBusy = false;
            document.body.classList.remove('busy');

            if (adventureData.every(n => n.completed)) setTimeout(() => alert("🏆 CASTELO CONQUISTADO!"), 500);
        }
    }

    function updateHP(amount) {
        playerHP += amount; if (playerHP < 0) playerHP = 0;
        document.getElementById('hp-bar').style.width = (playerHP/maxHP*100) + "%";
        document.getElementById('hp-text').innerText = playerHP + "/" + maxHP;
        if (playerHP === 0) { setTimeout(() => { alert("💀 VOCÊ CAIU NA MASMORRA..."); location.reload(); }, 500); }
    }

    function toggleModal(show) {
        const modal = document.getElementById('battleModal');
        const card = document.getElementById('battleCard');
        if (show) { modal.classList.add('show-modal'); setTimeout(() => card.classList.add('show-card'), 10); }
        else { card.classList.remove('show-card'); setTimeout(() => modal.classList.remove('show-modal'), 300); }
    }
    
    function closeBattleModal() { toggleModal(false); }

    function getDemoData(c) { 
        return Array(c).fill(0).map((_,i) => ({ 
            title: `Demo ${i+1}`, desc: "Teste", type: i===c-1?"boss":"enemy", completed: false,
            quiz: { question: "1+1?", options: ["2","3"], correct: 0 },
            magic: { statement: "Terra redonda?", is_true: true }
        })); 
    }
</script>
</body>
</html>
