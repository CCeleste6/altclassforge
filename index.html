<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class Forge V14 - Mobile Fix</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        /* --- CORE VISUALS --- */
        :root {
            --bg-dark: #050505;
            --card-bg: #141414;
            --gold: #d4af37;
            --green: #2ecc71;
            --red: #e74c3c;
            --text-main: #e0e0e0;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(335deg, #0f0f0f 23px, transparent 23px),
                linear-gradient(155deg, #0f0f0f 23px, transparent 23px);
            background-size: 58px 58px;
            color: var(--text-main);
            height: 100dvh; /* Altura real mobile */
            overflow: hidden; 
            display: flex; flex-direction: column; align-items: center;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 2px; }

        /* --- HUD --- */
        .hud-bar {
            position: fixed; top: 10px; right: 10px; z-index: 1000;
            background: rgba(0,0,0,0.9); padding: 8px 12px;
            border: 2px solid var(--gold); border-radius: 4px;
            display: none; align-items: center; gap: 8px;
        }
        .hp-track { width: 120px; height: 10px; background: #222; border: 1px solid #555; transform: skewX(-10deg); }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c); transition: width 0.4s ease-out; }

        /* --- CONFIG SCREEN --- */
        .config-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.98); z-index: 2000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            padding: 15px; overflow-y: auto;
        }
        
        .config-box {
            width: 100%; max-width: 500px; padding: 20px; background: #111;
            border: 2px solid var(--gold); box-shadow: 0 0 20px rgba(212, 175, 55, 0.1);
        }
        
        input, select, textarea {
            width: 100%; background: #080808; border: 1px solid #444; color: var(--gold);
            padding: 12px; margin: 5px 0 15px 0; font-family: 'Roboto', sans-serif;
            font-size: 16px; border-radius: 4px;
        }

        textarea { height: 60px; resize: none; }
        
        .btn-main {
            width: 100%; padding: 16px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.1rem;
            background: linear-gradient(180deg, #b8860b, #8b6508);
            color: #000; border: 1px solid #ffd700; cursor: pointer;
            text-transform: uppercase; margin-top: 10px; border-radius: 4px;
            touch-action: manipulation;
        }
        .btn-main:active { transform: scale(0.98); }

        /* --- MAPA --- */
        #game-area {
            width: 100%; height: 100%; display: none;
            overflow-x: auto; overflow-y: hidden;
            -webkit-overflow-scrolling: touch; 
            white-space: nowrap; padding: 0 20px;
        }
        .map-flex { display: flex; align-items: center; height: 100%; gap: 30px; padding-left: 50vw; padding-right: 50vw; }

        .card {
            width: 200px; height: 280px; flex-shrink: 0;
            background: var(--card-bg); border: 2px solid #444;
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; cursor: pointer;
            box-shadow: 0 5px 15px rgba(0,0,0,0.5);
            white-space: normal; /* Texto quebra linha */
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card.locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
        .card.cleared { border-color: var(--green); filter: grayscale(1) brightness(0.5); }
        
        .card-icon { font-size: 3rem; margin-bottom: 15px; }
        .card-title { font-size: 1rem; color: var(--gold); text-align: center; padding: 0 10px; }
        .connector { width: 30px; height: 4px; background: #333; flex-shrink: 0; }

        /* --- BATTLE MODAL --- */
        .battle-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1500;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); padding: 10px;
        }

        .battle-window {
            width: 100%; max-width: 600px; height: 95vh;
            background: #0f0f0f; border: 1px solid var(--gold);
            display: flex; flex-direction: column;
            animation: modalOpen 0.3s ease-out;
        }
        @keyframes modalOpen { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .battle-header {
            padding: 15px; background: rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;
        }
        
        .battle-body { padding: 15px; overflow-y: auto; flex: 1; }

        /* COMBAT OPTIONS - MOBILE LIST */
        .combat-selector { display: flex; flex-direction: column; gap: 10px; }
        .combat-option {
            background: #1a1a1a; border: 1px solid #333;
            display: flex; align-items: center; gap: 20px;
            padding: 20px; cursor: pointer; min-height: 80px;
        }
        .combat-option:active { border-color: var(--gold); background: #222; }
        .combat-icon { font-size: 2rem; }
        .combat-info h3 { margin: 0; color: var(--gold); font-size: 1rem; }
        .combat-info p { margin: 5px 0 0 0; color: #888; font-size: 0.8rem; }

        /* QUIZ & PUZZLE */
        .question-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 20px; text-align: left; }
        .quiz-btn {
            width: 100%; padding: 18px; margin-bottom: 10px;
            background: #1a1a1a; border: 1px solid #333; color: #ddd;
            text-align: left; cursor: pointer; font-size: 1rem; border-radius: 4px;
        }
        
        .word-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .word-slot {
            background: #222; border: 1px solid #555; padding: 10px 14px;
            cursor: pointer; border-radius: 4px; user-select: none;
        }

        .correct { background: rgba(46, 204, 113, 0.2) !important; border-color: var(--green) !important; color: var(--green) !important; }
        .wrong { background: rgba(231, 76, 60, 0.2) !important; border-color: var(--red) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        .hidden { display: none !important; }
        .loader { font-size: 3rem; animation: spin 2s infinite linear; margin-bottom: 10px; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <div id="game-hud" class="hud-bar">
        <span style="font-family:'Cinzel'; color:var(--gold); font-size:0.8rem;">HP</span>
        <div class="hp-track"><div id="hp-bar" class="hp-fill"></div></div>
        <span id="hp-text" style="font-size:0.8rem;">100</span>
    </div>

    <div id="config-screen" class="config-overlay">
        <h1 style="color: var(--gold); text-align: center; margin-bottom: 5px; font-size: 2rem;">CLASS FORGE</h1>
        <p style="color: #666; font-size: 0.7rem; letter-spacing: 3px; margin-bottom: 20px;">V14 MOBILE FIX</p>
        
        <div class="config-box">
            <label style="color:var(--gold); font-weight:bold; display:block; margin-bottom:5px;">📜 Matéria / Tema</label>
            <select id="subject">
                <option value="">-- MODO LIVRE (Usa PDF abaixo) --</option>
                <option value="História">História</option>
                <option value="Matemática">Matemática</option>
                <option value="Geografia">Geografia</option>
                <option value="Biologia">Biologia</option>
                <option value="Física">Física</option>
                <option value="Química">Química</option>
                <option value="Literatura">Literatura</option>
                <option value="Inglês">Inglês</option>
                <option value="Tecnologia">Tecnologia</option>
            </select>

            <label style="color:var(--gold); font-weight:bold; display:block; margin-bottom:5px;">📂 Texto ou PDF</label>
            <input type="file" id="fileInput" accept=".pdf, .txt">
            <textarea id="classContent" placeholder="Ou cole o texto aqui..."></textarea>

            <label style="color:var(--gold); font-weight:bold; display:block; margin-bottom:5px;">⚔️ Dificuldade</label>
            <select id="difficulty">
                <option value="3">Rápido (3 Salas)</option>
                <option value="5" selected>Normal (5 Salas)</option>
                <option value="7">Longo (7 Salas)</option>
            </select>

            <label style="color:var(--gold); font-weight:bold; display:block; margin-bottom:5px;">🔑 API Key (Gemini)</label>
            <input type="password" id="apiKey" placeholder="Cole sua chave aqui">

            <button class="btn-main" onclick="initGame(true)">JOGAR AGORA</button>
            <button class="btn-main" style="background: #222; border-color: #444; font-size: 0.8rem; margin-top: 15px;" onclick="initGame(false)">TESTAR (SEM API)</button>
        </div>
        
        <div id="loading" class="hidden" style="margin-top: 20px; text-align: center;">
            <div class="loader">⚙️</div>
            <p style="color: var(--gold);">Gerando Masmorra...</p>
        </div>
    </div>

    <div id="game-area">
        <div id="map-container" class="map-flex"></div>
    </div>

    <div id="battle-modal" class="battle-overlay">
        <div class="battle-window">
            <div class="battle-header">
                <h2 id="enemy-title" style="margin:0; color: var(--gold); font-size: 1rem;">INIMIGO</h2>
                <button onclick="closeModal()" style="background:none; border:none; color:#666; font-size:1.5rem; padding: 5px 15px;">✕</button>
            </div>
            <div class="battle-body" id="battle-body"></div>
        </div>
    </div>

<script>
    // --- ESTADO DO JOGO ---
    let playerHP = 100;
    let adventureData = [];
    let currentEnemyIndex = -1;
    let isBusy = false;

    // --- SEGURANÇA DE CARREGAMENTO ---
    window.addEventListener('DOMContentLoaded', () => {
        // Scroll Mouse (Desktop Only)
        const gameArea = document.getElementById('game-area');
        if (gameArea) {
            gameArea.addEventListener('wheel', (evt) => {
                if (window.matchMedia("(min-width: 769px)").matches) {
                    evt.preventDefault();
                    gameArea.scrollLeft += evt.deltaY;
                }
            });
        }
    });

    // --- LEITOR DE PDF ---
    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5);
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                fullText += (await page.getTextContent()).items.map(i => i.str).join(" ") + " ";
            }
            return fullText;
        } catch (e) { 
            console.error(e);
            return ""; 
        }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file && file.type === "application/pdf") {
            document.getElementById('classContent').value = "⏳ Lendo PDF...";
            document.getElementById('classContent').value = await readPDF(file);
        }
    });

    // --- FUNÇÃO DE INÍCIO (BLINDADA) ---
    async function initGame(useRealAI) {
        try {
            const content = document.getElementById('classContent').value;
            const apiKey = document.getElementById('apiKey').value;
            const difficulty = parseInt(document.getElementById('difficulty').value);
            const subject = document.getElementById('subject').value;

            // Validação
            if (subject === "" && (!content || content.length < 10 || content === "⏳ Lendo PDF...")) {
                alert("⚠️ Para o MODO LIVRE, você precisa carregar um PDF ou digitar um texto!");
                return;
            }
            if (useRealAI && !apiKey) {
                alert("⚠️ Falta a API Key!");
                return;
            }

            // UI Feedback
            document.querySelector('.config-box').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            const enemiesCount = difficulty - 1;

            if (useRealAI) {
                // Configuração do Prompt
                let context = "";
                if (subject === "") {
                    context = `Baseie-se ESTRITAMENTE neste texto: "${content.substring(0, 3000)}"`;
                } else {
                    context = `Matéria: ${subject}. Texto de apoio (se houver): "${content.substring(0, 2000)}"`;
                }

                const prompt = `
                Atue como Mestre de RPG Educacional.
                ${context}
                
                Gere uma aventura com ${enemiesCount} Inimigos e 1 Boss.
                Para cada inimigo, crie 3 modos de desafio:
                1. "quiz" (Múltipla Escolha, 3 opções)
                2. "magic" (Verdadeiro ou Falso)
                3. "stealth" (Enigma: frase curta, máx 6 palavras, para reordenar)

                Retorne APENAS JSON válido neste formato:
                [
                    {
                        "title": "Nome do Inimigo", "type": "enemy",
                        "quiz": { "question": "Pergunta...", "options": ["A","B","C"], "correct": 1 },
                        "magic": { "statement": "Afirmação...", "is_true": true },
                        "stealth": { "phrase": "Soma dos quadrados" }
                    },
                    { 
                        "title": "Boss Final", "type": "boss", 
                        "quiz": { "question": "Difícil...", "options": [], "correct": "Resposta" } 
                    }
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) throw new Error("Erro na API do Google");

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonText);

            } else {
                // Modo Demo
                await new Promise(r => setTimeout(r, 1500));
                adventureData = getDemoData(difficulty);
            }

            // Sucesso: Inicia o Mapa
            document.getElementById('config-screen').classList.add('hidden');
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('game-hud').style.display = 'flex';
            renderMap();

        } catch (error) {
            console.error(error);
            alert("Erro ao iniciar: " + error.message + "\nCarregando modo de demonstração de emergência.");
            adventureData = getDemoData(3);
            document.getElementById('config-screen').classList.add('hidden');
            document.getElementById('game-area').style.display = 'block';
            document.getElementById('game-hud').style.display = 'flex';
            renderMap();
        }
    }

    // --- RENDERIZAR MAPA ---
    function renderMap() {
        const container = document.getElementById('map-container');
        container.innerHTML = "";
        
        adventureData.forEach((node, index) => {
            if (index > 0) {
                const conn = document.createElement('div');
                conn.className = 'connector';
                container.appendChild(conn);
            }

            const card = document.createElement('div');
            const isLocked = index > 0 && !adventureData[index-1].completed;
            
            card.className = `card ${node.type} ${node.completed ? 'cleared' : ''} ${isLocked ? 'locked' : ''}`;
            
            // Evento Click Seguro
            card.onclick = function() {
                if (!isLocked && !node.completed && !isBusy) {
                    openBattleSelector(index);
                }
            };

            let icon = node.type === 'boss' ? '🐲' : '💀';
            if (node.completed) icon = '🛡️';

            card.innerHTML = `
                <div class="card-icon">${icon}</div>
                <div class="card-title">${node.title}</div>
            `;
            container.appendChild(card);
        });
    }

    // --- SISTEMA DE BATALHA ---
    function openBattleSelector(index) {
        currentEnemyIndex = index;
        const node = adventureData[index];
        document.getElementById('enemy-title').innerText = node.title.toUpperCase();
        document.getElementById('battle-modal').style.display = 'flex';
        
        if (node.type === 'boss') {
            renderCombat('quiz', true);
            return;
        }

        document.getElementById('battle-body').innerHTML = `
            <div class="combat-selector">
                <div class="combat-option" onclick="renderCombat('quiz')">
                    <div class="combat-icon">⚔️</div>
                    <div class="combat-info"><h3>COMBATE</h3><p>Quiz Múltipla Escolha</p></div>
                </div>
                <div class="combat-option" onclick="renderCombat('magic')">
                    <div class="combat-icon">✨</div>
                    <div class="combat-info"><h3>MAGIA</h3><p>Verdadeiro ou Falso</p></div>
                </div>
                <div class="combat-option" onclick="renderCombat('stealth')">
                    <div class="combat-icon">🧩</div>
                    <div class="combat-info"><h3>FURTIVO</h3><p>Puzzle de Palavras</p></div>
                </div>
            </div>`;
    }

    function renderCombat(mode, isBoss = false) {
        const node = adventureData[currentEnemyIndex];
        const body = document.getElementById('battle-body');
        let html = "";

        if (mode === 'quiz') {
            html = `<p class="question-text">${node.quiz.question}</p>`;
            if (isBoss && (!node.quiz.options || node.quiz.options.length === 0)) {
                // Boss Dissertativo
                html += `<div style="text-align:center; color:#888; margin-bottom:20px;"><em>Gabarito Sugerido: ${node.quiz.correct}</em></div>
                         <button class="btn-main" onclick="resolveBattle(true)">CONFIRMAR VITÓRIA</button>`;
            } else {
                node.quiz.options.forEach((opt, i) => {
                    html += `<button class="quiz-btn" onclick="checkQuiz(${i}, ${node.quiz.correct})">${opt}</button>`;
                });
            }
        } 
        else if (mode === 'magic') {
            html = `<p class="question-text" style="text-align:center; font-style:italic;">"${node.magic.statement}"</p>
                    <button class="btn-main" onclick="checkMagic(true, ${node.magic.is_true})">VERDADEIRO</button>
                    <button class="btn-main" style="background:#222; margin-top:15px;" onclick="checkMagic(false, ${node.magic.is_true})">FALSO</button>`;
        }
        else if (mode === 'stealth') {
            const phrase = node.stealth.phrase;
            const shuffled = phrase.split(' ').sort(() => Math.random() - 0.5);
            html = `<p style="text-align:center; color:#888; margin-bottom:10px;">Reconstrua a frase:</p>
                    <div class="answer-area" id="puzzle-answer"></div>
                    <div class="word-bank" id="puzzle-bank"></div>
                    <button class="btn-main" id="check-puzzle-btn" onclick="checkPuzzle('${phrase}')" style="opacity:0.5; margin-top:20px;">HACKEAR</button>`;
            
            // Renderiza palavras após HTML
            setTimeout(() => {
                const bank = document.getElementById('puzzle-bank');
                shuffled.forEach(w => {
                    const span = document.createElement('span');
                    span.className = 'word-slot';
                    span.innerText = w;
                    span.onclick = function() { moveWord(this); };
                    bank.appendChild(span);
                });
            }, 50);
        }

        if(!isBoss) {
            html += `<button onclick="openBattleSelector(${currentEnemyIndex})" style="width:100%; padding:15px; background:none; border:none; color:#666; margin-top:15px;">VOLTAR</button>`;
        }
        
        body.innerHTML = html;
    }

    // --- LÓGICA DE JOGO ---
    function moveWord(el) {
        const bank = document.getElementById('puzzle-bank');
        const answer = document.getElementById('puzzle-answer');
        if (el.parentElement === bank) answer.appendChild(el);
        else bank.appendChild(el);
        document.getElementById('check-puzzle-btn').style.opacity = '1';
    }

    function checkPuzzle(target) {
        const answerDiv = document.getElementById('puzzle-answer');
        const userPhrase = Array.from(answerDiv.children).map(s => s.innerText).join(' ');
        if (userPhrase.replace(/\s+/g,'').toLowerCase() === target.replace(/\s+/g,'').toLowerCase()) {
            winEffect(document.getElementById('check-puzzle-btn'));
        } else {
            loseEffect(document.getElementById('check-puzzle-btn'));
        }
    }

    function checkQuiz(sel, cor) {
        const btns = document.querySelectorAll('.quiz-btn');
        if (sel === cor) winEffect(btns[sel]);
        else loseEffect(btns[sel]);
    }

    function checkMagic(userVal, correctVal) {
        const btns = document.querySelectorAll('.btn-main');
        // Botão 0 é Verdadeiro, Botão 1 é Falso
        const targetBtn = userVal ? btns[0] : btns[1];
        if (userVal === correctVal) winEffect(targetBtn);
        else loseEffect(targetBtn);
    }

    function winEffect(el) {
        if(!el) return;
        el.classList.add('correct');
        isBusy = true;
        setTimeout(() => {
            resolveBattle(true);
            isBusy = false;
        }, 800);
    }

    function loseEffect(el) {
        if(!el) return;
        el.classList.add('wrong');
        updateHP(-15);
        setTimeout(() => el.classList.remove('wrong'), 800);
    }

    function resolveBattle(win) {
        if(win) {
            adventureData[currentEnemyIndex].completed = true;
            document.getElementById('battle-modal').style.display = 'none';
            renderMap();
            if(adventureData.every(n => n.completed)) {
                setTimeout(() => alert("🏆 VITÓRIA! VOCÊ ZEROU A MATÉRIA!"), 500);
            }
        }
    }

    function updateHP(amt) {
        playerHP += amt;
        if(playerHP < 0) playerHP = 0;
        document.getElementById('hp-bar').style.width = playerHP + '%';
        document.getElementById('hp-text').innerText = playerHP;
        
        if (playerHP === 0) {
            alert("💀 GAME OVER! Tente novamente.");
            location.reload();
        }
    }

    function closeModal() {
        document.getElementById('battle-modal').style.display = 'none';
    }

    function getDemoData(diff) {
        return Array(diff).fill(0).map((_, i) => ({
            title: i===diff-1 ? "Chefe Final" : `Desafio ${i+1}`,
            type: i===diff-1 ? "boss" : "enemy",
            completed: false,
            quiz: { question: "Quanto é 2 + 2?", options: ["3","4","5"], correct: 1 },
            magic: { statement: "O sol é frio.", is_true: false },
            stealth: { phrase: "Conhecimento é poder" }
        }));
    }
</script>
</body>
</html>
