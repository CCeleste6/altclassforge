<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Journey Prototype - Teacher View</title>
    
    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        /* --- ESTILO VISUAL (DARK/GOLD THEME) --- */
        :root {
            --bg-color: #0b0c15; 
            --card-bg: #1e2328;
            --gold: #c8aa6e;     
            --blue: #0ac8b9;     
            --text: #f0f0f0;
        }
        
        body { 
            font-family: 'Segoe UI', sans-serif; 
            background: var(--bg-color); 
            color: var(--text); 
            margin: 0; 
            padding: 20px;
            display: flex;
            flex-direction: column;
            align-items: center;
            min-height: 100vh;
        }

        h1 { color: var(--gold); text-transform: uppercase; letter-spacing: 2px; border-bottom: 2px solid var(--gold); padding-bottom: 10px; }

        /* PAINEL DE CONFIGURAÇÃO */
        .config-panel {
            background: rgba(30, 35, 40, 0.95);
            border: 1px solid #333;
            padding: 30px;
            border-radius: 8px;
            width: 100%;
            max-width: 600px;
            box-shadow: 0 0 30px rgba(0,0,0,0.6);
            z-index: 10;
        }

        input, textarea { 
            width: 100%; box-sizing: border-box; 
            background: #121212; border: 1px solid #444; color: #fff; 
            padding: 10px; margin-top: 5px; margin-bottom: 15px; border-radius: 4px;
        }
        
        button {
            background: linear-gradient(45deg, #b38936, #f5d67b);
            color: #000; font-weight: bold; border: none;
            padding: 12px 25px; border-radius: 4px; cursor: pointer;
            text-transform: uppercase; letter-spacing: 1px;
            width: 100%; margin-bottom: 10px;
            transition: transform 0.2s;
        }
        button:hover { filter: brightness(1.1); transform: scale(1.02); }
        .btn-demo { background: #333; color: #aaa; border: 1px solid #555; }

        /* MAPA HORIZONTAL */
        #game-map-container {
            width: 100%;
            overflow-x: auto; 
            padding: 50px 20px;
            display: none; 
            white-space: nowrap; 
            scrollbar-width: thin;
            scrollbar-color: var(--gold) var(--bg-color);
        }

        .map-wrapper { display: inline-flex; align-items: center; gap: 20px; }

        .node-card {
            display: inline-block;
            vertical-align: top;
            width: 280px;
            white-space: normal;
            background: var(--card-bg);
            border: 2px solid #444;
            border-radius: 12px;
            padding: 20px;
            position: relative;
            transition: transform 0.3s;
            box-shadow: 0 10px 20px rgba(0,0,0,0.5);
        }
        
        .node-card:hover { transform: translateY(-10px); border-color: var(--blue); }

        .node-icon {
            width: 50px; height: 50px; background: #333; border-radius: 50%;
            display: flex; align-items: center; justify-content: center;
            font-size: 24px; margin: 0 auto 15px auto;
            border: 2px solid var(--gold);
            box-shadow: 0 0 10px var(--gold);
        }

        .boss-card { border-color: #ff4444; background: linear-gradient(180deg, #1e2328, #2a1a1a); }
        .boss-card .node-icon { border-color: #ff4444; box-shadow: 0 0 15px #ff4444; }

        .connector { display: inline-block; width: 50px; height: 4px; background: #444; border-radius: 2px; }

        .details-box {
            background: rgba(0,0,0,0.4);
            padding: 10px;
            margin-top: 10px;
            border-radius: 6px;
            font-size: 0.85rem;
            color: #ccc;
            border: 1px dashed #444;
        }

        .hidden { display: none !important; }
        
        /* Loading */
        .loader { border: 8px solid #333; border-top: 8px solid var(--gold); border-radius: 50%; width: 50px; height: 50px; animation: spin 1s linear infinite; margin: 20px auto; }
        @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    </style>
</head>
<body>

    <header style="text-align: center;">
        <h1>🛡️ Class Forge 🛡️</h1>
        <p style="color: #888; margin-top: -10px;">Teacher's Dashboard</p>
    </header>

    <div class="config-panel" id="setup-panel">
        <label>1. Carregar Conteúdo (PDF ou Texto)</label>
        <input type="file" id="fileInput" accept=".pdf, .txt">
        <textarea id="classContent" placeholder="O texto da aula aparecerá aqui..."></textarea>
        
        <label>2. Chave de Inteligência (Gemini)</label>
        <input type="password" id="apiKey" placeholder="Cole sua API Key NOVA aqui">
        
        <button onclick="generateAdventure(true)">🔮 Criar Jornada (IA Real)</button>
        <button class="btn-demo" onclick="generateAdventure(false)">🎲 Testar (Modo Demo)</button>
    </div>

    <div id="loading" class="hidden" style="text-align: center;">
        <div class="loader"></div>
        <h3 style="color: var(--gold)">Invocando Desafios...</h3>
        <p>A IA está lendo o documento e criando os inimigos.</p>
    </div>

    <div id="game-map-container">
        <div id="map-wrapper" class="map-wrapper"></div>
        <div style="text-align: center; margin-top: 20px; position: fixed; bottom: 20px; left: 50%; transform: translateX(-50%);">
            <button onclick="location.reload()" style="width: auto; padding: 10px 40px; box-shadow: 0 0 20px #000;">Nova Aventura</button>
        </div>
    </div>

<script>
    // --- 1. LEITURA DE PDF ---
    let pdfRawText = "";

    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5); 
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                const textContent = await page.getTextContent();
                const pageText = textContent.items.map(item => item.str).join(" ");
                fullText += pageText + " ";
            }
            return fullText;
        } catch (e) {
            console.error(e);
            alert("Erro ao ler PDF. Tente outro arquivo.");
            return "";
        }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (!file) return;
        const textArea = document.getElementById('classContent');
        textArea.value = "⏳ Lendo arquivo...";
        
        if (file.type === "application/pdf") {
            pdfRawText = await readPDF(file);
            textArea.value = pdfRawText || "Erro: PDF vazio ou ilegível (imagem).";
        } else {
            const reader = new FileReader();
            reader.onload = function(e) {
                pdfRawText = e.target.result;
                textArea.value = e.target.result;
            };
            reader.readAsText(file);
        }
    });

    // --- 2. INTEGRAÇÃO COM IA ---
    async function generateAdventure(useRealAI) {
        const content = document.getElementById('classContent').value;
        const apiKey = document.getElementById('apiKey').value;
        
        if (!content && useRealAI) { alert("O campo de texto está vazio!"); return; }
        if (useRealAI && !apiKey) { alert("Cole a API Key!"); return; }

        document.getElementById('setup-panel').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        let adventureData = [];

        if (useRealAI) {
            try {
                const prompt = `
                Atue como Game Master. Texto Base: "${content.substring(0, 3000)}"
                Crie 4 fases (3 inimigos + 1 Boss). Retorne APENAS JSON puro:
                [
                    {"title": "Nome Criativo", "desc": "Contexto", "type": "enemy", "question": "Pergunta Quiz", "options": ["A","B","C"], "correct": 1},
                    {"title": "Nome do Boss", "desc": "Contexto", "type": "boss", "question": "Pergunta Difícil", "options": [], "correct": "Gabarito"}
                ]`;

                // --- AQUI ESTÁ A CORREÇÃO (gemini-2.5-flash) ---
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                if (!response.ok) {
                    const errorDetails = await response.json();
                    throw new Error("Erro API: " + (errorDetails.error?.message || response.status));
                }
                
                const data = await response.json();
                const textResponse = data.candidates[0].content.parts[0].text;
                const jsonClean = textResponse.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonClean);

            } catch (error) {
                console.error(error);
                alert("Falha: " + error.message + "\n\nUsando Modo Demo por segurança.");
                adventureData = getDemoData();
            }
        } else {
            await new Promise(r => setTimeout(r, 1500));
            adventureData = getDemoData();
        }

        renderMap(adventureData);
    }

    // --- 3. RENDERIZAÇÃO ---
    function renderMap(data) {
        const wrapper = document.getElementById('map-wrapper');
        document.getElementById('loading').classList.add('hidden');
        document.getElementById('game-map-container').style.display = 'block';
        wrapper.innerHTML = '';

        data.forEach((node, index) => {
            if (index > 0) {
                const conn = document.createElement('div');
                conn.className = 'connector';
                wrapper.appendChild(conn);
            }

            const card = document.createElement('div');
            card.className = `node-card ${node.type === 'boss' ? 'boss-card' : ''}`;
            
            let icon = node.type === 'boss' ? '👑' : '⚔️';
            let quizContent = '';
            
            if(node.options && node.options.length > 0) {
                quizContent = `
                    <div class="details-box">
                        <strong>Q:</strong> ${node.question}
                        <div style="margin-top:5px; color:#4cd137">✔ ${node.options[node.correct]}</div>
                    </div>`;
            } else {
                quizContent = `
                    <div class="details-box" style="border-color: #ffd700;">
                        <strong>BOSS:</strong> ${node.question}
                    </div>`;
            }

            card.innerHTML = `
                <div class="node-icon">${icon}</div>
                <h3 style="margin:0; color: var(--gold)">${node.title}</h3>
                <p style="font-size:0.9rem; color:#aaa">${node.desc}</p>
                ${quizContent}
            `;
            wrapper.appendChild(card);
        });
    }

    function getDemoData() {
        return [
            { title: "Início da Jornada", desc: "Primeiro desafio.", type: "enemy", question: "Questão de teste?", options: ["Errada", "Certa", "Errada"], correct: 1 },
            { title: "O Guardião", desc: "Desafio médio.", type: "boss", question: "Questão final?", options: [], correct: "Resposta..." }
        ];
    }
</script>

</body>
</html>
