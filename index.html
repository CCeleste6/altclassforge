<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Class Forge V13 - Mobile Edition</title>
    
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;700&family=Roboto:wght@300;400;700&display=swap" rel="stylesheet">

    <script src="https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.min.js"></script>
    <script>pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/2.16.105/pdf.worker.min.js';</script>

    <style>
        /* --- CORE VISUALS --- */
        :root {
            --bg-dark: #050505;
            --card-bg: #141414;
            --gold: #d4af37;
            --gold-glow: #ffd700;
            --fire-core: #ffeba7;
            --fire-mid: #ff7b00;
            --text-main: #e0e0e0;
            --green: #2ecc71;
            --red: #e74c3c;
        }

        * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

        body {
            font-family: 'Roboto', sans-serif;
            margin: 0; padding: 0;
            background-color: var(--bg-dark);
            background-image: 
                linear-gradient(335deg, #0f0f0f 23px, transparent 23px),
                linear-gradient(155deg, #0f0f0f 23px, transparent 23px);
            background-size: 58px 58px;
            color: var(--text-main);
            height: 100vh; /* Fallback */
            height: 100dvh; /* Altura real mobile */
            overflow: hidden; 
            display: flex; flex-direction: column; align-items: center;
        }

        h1, h2, h3 { font-family: 'Cinzel', serif; letter-spacing: 2px; }

        /* --- TOCHAS (Somente Desktop) --- */
        .torch-container {
            position: fixed; top: 20%; width: 100px; height: 300px; z-index: 1; pointer-events: none;
        }
        .torch-left { left: 20px; }
        .torch-right { right: 20px; }

        .torch-flame {
            width: 30px; height: 50px;
            background: linear-gradient(0deg, var(--fire-core), var(--fire-mid), transparent);
            border-radius: 50% 50% 20% 20%;
            position: absolute; left: 35px; top: 0; filter: blur(5px);
            animation: flicker 0.5s infinite alternate;
            box-shadow: 0 0 40px 10px rgba(255, 100, 0, 0.4);
        }
        .torch-handle {
            width: 10px; height: 100px; background: #444;
            position: absolute; left: 45px; top: 40px;
            background: linear-gradient(90deg, #222, #555, #222);
            transform: perspective(10px) rotateX(5deg);
        }
        @keyframes flicker {
            0% { transform: scale(1) skewX(-2deg); opacity: 0.9; }
            100% { transform: scale(0.95) skewX(-1deg); opacity: 0.8; }
        }

        /* --- HUD --- */
        .hud-bar {
            position: fixed; top: 15px; right: 15px; z-index: 1000;
            background: rgba(0,0,0,0.9); padding: 8px 15px;
            border: 2px solid var(--gold); border-radius: 4px;
            display: none; align-items: center; gap: 10px;
            transform-origin: top right;
        }
        .hp-track { width: 150px; height: 12px; background: #222; border: 1px solid #555; transform: skewX(-10deg); }
        .hp-fill { width: 100%; height: 100%; background: linear-gradient(90deg, #c0392b, #e74c3c); transition: width 0.4s ease-out; }

        /* --- CONFIG SCREEN --- */
        .config-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.96); z-index: 2000;
            display: flex; justify-content: center; align-items: center; flex-direction: column;
            padding: 20px; overflow-y: auto; /* Scroll se a tela for pequena */
        }
        
        .config-box {
            width: 100%; max-width: 500px; padding: 25px; background: #111;
            border: 2px solid var(--gold); box-shadow: 0 0 30px rgba(212, 175, 55, 0.2);
            position: relative;
        }
        
        input, select {
            width: 100%; background: #000; border: 1px solid #444; color: var(--gold);
            padding: 12px; margin: 8px 0 15px 0; font-family: 'Roboto', sans-serif;
            font-size: 16px; /* Evita zoom no iOS */
        }
        
        .btn-main {
            width: 100%; padding: 15px; font-family: 'Cinzel', serif; font-weight: 700; font-size: 1.1rem;
            background: linear-gradient(180deg, #b8860b, #8b6508);
            color: #000; border: 1px solid #ffd700; cursor: pointer;
            text-transform: uppercase; margin-top: 10px;
            touch-action: manipulation;
        }

        /* --- MAPA --- */
        #game-area {
            width: 100%; height: 100%; display: none;
            overflow-x: auto; overflow-y: hidden;
            -webkit-overflow-scrolling: touch; /* Scroll suave no iOS */
            white-space: nowrap; padding: 0 20px;
        }
        .map-flex { display: flex; align-items: center; height: 100%; gap: 40px; padding-left: 50vw; padding-right: 50vw; }

        .card {
            width: 220px; height: 300px; flex-shrink: 0;
            background: var(--card-bg); border: 2px solid #444;
            display: inline-flex; flex-direction: column; align-items: center; justify-content: center;
            position: relative; cursor: pointer;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
            transition: transform 0.2s;
        }
        .card:active { transform: scale(0.95); }
        .card.locked { opacity: 0.5; filter: grayscale(1); pointer-events: none; }
        .card.cleared { border-color: var(--green); filter: grayscale(1) brightness(0.5); }
        .card.cleared::after { content: "DOMINADO"; position: absolute; color: var(--green); font-family: 'Cinzel'; font-weight: bold; font-size: 1.5rem; transform: rotate(-15deg); text-shadow: 0 0 10px #000; }
        
        .card-icon { font-size: 3.5rem; margin-bottom: 20px; }
        .card-title { font-size: 1.1rem; color: var(--gold); text-align: center; margin: 10px; white-space: normal; }
        .connector { width: 40px; height: 4px; background: #333; position: relative; flex-shrink: 0; }

        /* --- BATTLE MODAL (RESPONSIVO) --- */
        .battle-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: rgba(0,0,0,0.95); z-index: 1500;
            display: none; justify-content: center; align-items: center;
            backdrop-filter: blur(5px); padding: 10px;
        }

        .battle-window {
            width: 100%; max-width: 700px; height: 90vh;
            background: #0f0f0f; border: 1px solid var(--gold);
            display: flex; flex-direction: column;
            box-shadow: 0 0 50px rgba(0,0,0,0.9);
            animation: modalOpen 0.3s ease-out;
        }
        @keyframes modalOpen { from { transform: scale(0.95); opacity: 0; } to { transform: scale(1); opacity: 1; } }

        .battle-header {
            padding: 15px; background: rgba(212, 175, 55, 0.1);
            border-bottom: 1px solid #333; display: flex; justify-content: space-between; align-items: center;
        }
        
        .battle-body { padding: 20px; overflow-y: auto; flex: 1; }

        /* SELETORES DE COMBATE (MOBILE FRIENDLY) */
        .combat-selector { 
            display: flex; gap: 15px; height: 100%; 
            flex-direction: row; /* Desktop Default */
        }
        .combat-option {
            flex: 1; background: #1a1a1a; border: 1px solid #333;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            cursor: pointer; padding: 15px; text-align: center; min-height: 150px;
        }
        .combat-option:active { background: #222; border-color: var(--gold); }
        
        /* PUZZLE & QUIZ */
        .word-bank { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-top: 20px; }
        .word-slot {
            background: #222; border: 1px solid #555; padding: 12px 16px;
            cursor: pointer; border-radius: 4px; user-select: none; font-size: 0.9rem;
        }
        
        .answer-area { 
            background: #000; border-bottom: 2px solid var(--gold); 
            min-height: 60px; display: flex; flex-wrap: wrap; gap: 8px; 
            padding: 15px; justify-content: center; margin-bottom: 20px;
        }

        .question-text { font-size: 1.1rem; line-height: 1.5; margin-bottom: 25px; }
        .quiz-btn {
            width: 100%; padding: 18px; margin-bottom: 12px;
            background: #1a1a1a; border: 1px solid #333; color: #ddd;
            text-align: left; cursor: pointer; font-size: 1rem;
        }

        .correct { background: rgba(46, 204, 113, 0.2) !important; border-color: var(--green) !important; color: var(--green) !important; }
        .wrong { background: rgba(231, 76, 60, 0.2) !important; border-color: var(--red) !important; animation: shake 0.4s; }
        @keyframes shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-10px); } 75% { transform: translateX(10px); } }

        .hidden { display: none !important; }

        /* --- MEDIA QUERIES (O SEGREDO DO MOBILE) --- */
        @media (max-width: 768px) {
            /* Esconde Tochas no celular pra limpar a tela */
            .torch-container { display: none; }
            
            /* Ajusta HUD */
            .hud-bar { top: 10px; right: 10px; padding: 5px 10px; transform: scale(0.9); }
            
            /* Ajusta Config Screen */
            .config-box { width: 100%; border-left: none; border-right: none; padding: 15px; }
            h1 { font-size: 2rem; }
            
            /* Ajusta Cards */
            .card { width: 180px; height: 260px; }
            .map-flex { padding-left: 20px; padding-right: 20px; gap: 20px; }
            
            /* Ajusta Batalha */
            .battle-window { height: 100%; border: none; }
            
            /* Importante: Transforma as opções de combate em LISTA VERTICAL */
            .combat-selector { flex-direction: column; height: auto; }
            .combat-option { flex-direction: row; min-height: 80px; text-align: left; gap: 20px; justify-content: flex-start; }
            .combat-icon { font-size: 2rem; margin-bottom: 0; }
            .combat-title { margin-bottom: 0; font-size: 1rem; }
            .combat-desc { font-size: 0.8rem; display: none; /* Esconde descrição pra caber melhor */ }
            
            /* Botões maiores para dedo */
            .quiz-btn, .word-slot { padding: 15px; font-size: 1rem; }
        }
    </style>
</head>
<body>

    <div class="torch-container torch-left"><div class="torch-flame"></div><div class="torch-handle"></div></div>
    <div class="torch-container torch-right"><div class="torch-flame"></div><div class="torch-handle"></div></div>

    <div id="game-hud" class="hud-bar">
        <span style="font-family:'Cinzel'; color:var(--gold)">HP</span>
        <div class="hp-track"><div id="hp-bar" class="hp-fill"></div></div>
        <span id="hp-text">100/100</span>
    </div>

    <div id="config-screen" class="config-overlay">
        <h1 style="color: var(--gold); text-align: center; margin-bottom: 5px;">CLASS FORGE</h1>
        <p style="color: #666; font-size: 0.8rem; letter-spacing: 3px; margin-bottom: 30px;">V13 MOBILE EDITION</p>
        
        <div class="config-box">
            <label>📜 Matéria / Tema</label>
            <select id="subject">
                <option value="">-- MODO LIVRE (Baseado no PDF) --</option>
                <option value="História">História</option>
                <option value="Matemática">Matemática</option>
                <option value="Geografia">Geografia</option>
                <option value="Biologia">Biologia</option>
                <option value="Física">Física</option>
                <option value="Química">Química</option>
                <option value="Literatura">Literatura</option>
                <option value="Inglês">Inglês</option>
                <option value="Tecnologia">Tecnologia</option>
            </select>

            <label>📂 PDF (Opcional)</label>
            <input type="file" id="fileInput" accept=".pdf, .txt">
            <input type="text" id="classContent" style="display:none;" value="">

            <label>⚔️ Dificuldade</label>
            <select id="difficulty">
                <option value="3">Rápido (3 Salas)</option>
                <option value="5" selected>Normal (5 Salas)</option>
                <option value="7">Longo (7 Salas)</option>
            </select>

            <label>🔑 Chave API (Gemini)</label>
            <input type="password" id="apiKey" placeholder="Cole sua API Key aqui">

            <button class="btn-main" onclick="startGame(true)">JOGAR AGORA</button>
            <button class="btn-main" style="background: #222; border-color: #444; font-size: 0.8rem; margin-top: 15px;" onclick="startGame(false)">TESTAR SEM API</button>
        </div>
        
        <div id="loading" class="hidden" style="margin-top: 20px; text-align: center;">
            <div style="font-size: 2rem; animation: spin 2s infinite linear;">⚙️</div>
            <p style="color: var(--gold); margin-top: 10px;">Criando Masmorra...</p>
        </div>
    </div>

    <div id="game-area">
        <div id="map-container" class="map-flex">
            </div>
    </div>

    <div id="battle-modal" class="battle-overlay">
        <div class="battle-window">
            <div class="battle-header">
                <h2 id="enemy-title" style="margin:0; color: var(--gold); font-size: 1.2rem;">Inimigo</h2>
                <button onclick="closeModal()" style="background:none; border:none; color:#666; font-size:1.5rem; padding: 10px;">✕</button>
            </div>
            
            <div class="battle-body" id="battle-body">
                </div>
        </div>
    </div>

<script>
    // --- SCROLL MOUSE (Desktop) ---
    const gameArea = document.getElementById('game-area');
    gameArea.addEventListener('wheel', (evt) => {
        // Apenas no desktop (sem touch)
        if (window.matchMedia("(min-width: 769px)").matches) {
            evt.preventDefault();
            gameArea.scrollLeft += evt.deltaY;
        }
    });

    let playerHP = 100;
    let adventureData = [];
    let currentEnemyIndex = -1;
    let isBusy = false;

    // --- PDF LOGIC ---
    async function readPDF(file) {
        try {
            const arrayBuffer = await file.arrayBuffer();
            const pdf = await pdfjsLib.getDocument({ data: arrayBuffer }).promise;
            let fullText = "";
            const maxPages = Math.min(pdf.numPages, 5);
            for (let i = 1; i <= maxPages; i++) {
                const page = await pdf.getPage(i);
                fullText += (await page.getTextContent()).items.map(i => i.str).join(" ") + " ";
            }
            return fullText;
        } catch (e) { return ""; }
    }

    document.getElementById('fileInput').addEventListener('change', async function(e) {
        const file = e.target.files[0];
        if (file && file.type === "application/pdf") {
            document.getElementById('classContent').value = await readPDF(file);
        }
    });

    // --- GAME ENGINE ---
    async function startGame(useRealAI) {
        const content = document.getElementById('classContent').value;
        const apiKey = document.getElementById('apiKey').value;
        const difficulty = parseInt(document.getElementById('difficulty').value);
        const subject = document.getElementById('subject').value;

        if (subject === "" && (!content || content.length < 20)) {
            alert("No MODO LIVRE, você precisa enviar um PDF!");
            return;
        }
        if (useRealAI && !apiKey) return alert("Cole a API Key!");

        document.querySelector('.config-box').classList.add('hidden');
        document.getElementById('loading').classList.remove('hidden');

        const enemiesCount = difficulty - 1;

        if (useRealAI) {
            try {
                let context = subject === "" 
                    ? `Baseie-se APENAS neste texto: "${content.substring(0, 3000)}"` 
                    : `Matéria: ${subject}. Apoio: "${content.substring(0, 2000)}"`;

                const prompt = `Atue como Mestre de RPG Educacional. ${context}.
                Gere ${enemiesCount} Inimigos e 1 Boss.
                Para cada, crie 3 modos:
                1. "quiz" (3 opções)
                2. "magic" (Verdadeiro/Falso)
                3. "stealth" (Frase curta max 6 palavras para reordenar)

                JSON Estrito:
                [
                    {
                        "title": "Nome Curto", "type": "enemy",
                        "quiz": { "question": "...", "options": ["A","B","C"], "correct": 1 },
                        "magic": { "statement": "...", "is_true": true },
                        "stealth": { "phrase": "Soma dos catetos" }
                    },
                    { "title": "Boss", "type": "boss", "quiz": { "question": "Difícil", "options": [], "correct": "Gab" } }
                ]`;

                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST', headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({ contents: [{ parts: [{ text: prompt }] }] })
                });

                const data = await response.json();
                const jsonText = data.candidates[0].content.parts[0].text.replace(/```json|```/g, '').trim();
                adventureData = JSON.parse(jsonText);

            } catch (e) {
                alert("Erro IA. Usando Demo.");
                adventureData = getDemoData(difficulty);
            }
        } else {
            await new Promise(r => setTimeout(r, 1000));
            adventureData = getDemoData(difficulty);
        }

        document.getElementById('config-screen').classList.add('hidden');
        document.getElementById('game-area').style.display = 'block';
        document.getElementById('game-hud').style.display = 'flex';
        renderMap();
    }

    function renderMap() {
        const container = document.getElementById('map-container');
        container.innerHTML = "";
        adventureData.forEach((node, index) => {
            if (index > 0) container.appendChild(document.createElement('div')).className = 'connector';

            const card = document.createElement('div');
            const isLocked = index > 0 && !adventureData[index-1].completed;
            card.className = `card ${node.type} ${node.completed ? 'cleared' : ''} ${isLocked ? 'locked' : ''}`;
            
            if (!isLocked && !node.completed) card.onclick = () => openBattleSelector(index);

            let icon = node.type === 'boss' ? '🐲' : '💀';
            if (node.completed) icon = '🛡️';

            card.innerHTML = `<div class="card-icon">${icon}</div><div class="card-title">${node.title}</div>`;
            container.appendChild(card);
        });
    }

    function openBattleSelector(index) {
        if(isBusy) return;
        currentEnemyIndex = index;
        const node = adventureData[index];
        document.getElementById('enemy-title').innerText = node.title;
        document.getElementById('battle-modal').style.display = 'flex';
        
        if (node.type === 'boss') { renderCombat('quiz', true); return; }

        document.getElementById('battle-body').innerHTML = `
            <div class="combat-selector">
                <div class="combat-option" onclick="renderCombat('quiz')">
                    <div class="combat-icon">⚔️</div>
                    <div><div class="combat-title">COMBATE</div><div class="combat-des
